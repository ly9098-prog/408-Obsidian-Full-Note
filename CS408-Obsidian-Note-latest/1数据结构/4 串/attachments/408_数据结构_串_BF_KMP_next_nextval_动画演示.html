<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark">

<style>

*{box-sizing:border-box}

.field{min-width:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035);transition:border-color .18s ease,background .18s ease}

.action-btn,.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);cursor:pointer;transition:transform .17s ease,background .17s ease,border-color .17s ease,opacity .17s ease}
.action-btn{height:44px;padding:0 14px;border-radius:13px;font-size:12px;font-weight:680;white-space:nowrap}

.action-btn:active,.icon-btn:active{transform:scale(.96)}
.error{position:relative;z-index:3;min-height:21px;margin:0 17px;color:#ff9aa6;font-size:11px;line-height:1.5}
.main-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(330px,.6fr);min-height:610px}

.cell{fill:rgba(255,255,255,.035);stroke:rgba(255,255,255,.09);stroke-width:1}

.cell.good{fill:var(--goodSoft);stroke:rgba(103,212,155,.44)}

.cell.warn{fill:var(--warnSoft);stroke:rgba(255,189,107,.46)}
.ch{fill:#eef3fb;font-size:15px;font-weight:730;text-anchor:middle;dominant-baseline:middle}
.idx{fill:#586276;font-size:9px;font-weight:650;text-anchor:middle}

.table-value.good{fill:#95e8bc}

.code-panel{min-width:0;display:flex;flex-direction:column;background:rgba(8,10,15,.28)}

.code-block{margin:0;padding:0;font:12.4px/1.72 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;letter-spacing:0}

.code-line .no{color:#4e5869;text-align:right;user-select:none;font-variant-numeric:tabular-nums}.code-line.section{margin-top:8px;color:#c1cad9;font-weight:720}.code-line.section .no{color:transparent}.code-line.comment{color:#657083}.code-line.near{color:#b2bccb}
.code-line.active{color:#f5f7fc;background:rgba(120,167,255,.105);box-shadow:inset 2px 0 0 var(--accent)}.code-line.active .no{color:#9bc0ff}
.code-line.active.goodline{background:rgba(103,212,155,.09);box-shadow:inset 2px 0 0 var(--good)}
.code-note{padding:11px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.55}.code-note strong{color:#e7ecf5;font-weight:700}
.progress{position:relative;z-index:2;height:2px;margin:0 20px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.055)}.progress>div{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#78a7ff,#9d8eff);transition:width .34s var(--ease)}
.control-wrap{position:relative;z-index:3;padding:12px 14px 14px}
.control-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:70px;padding:10px 12px;border:1px solid var(--line);border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(155%);backdrop-filter:blur(28px) saturate(155%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 34px rgba(0,0,0,.18)}
.control-left,.control-center,.control-right{display:flex;align-items:center;gap:8px}.control-center{justify-content:center}.control-right{justify-content:flex-end}
.icon-btn{width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:50%}.play-btn{width:50px;height:50px;padding:0;display:grid;place-items:center;border:1px solid rgba(255,255,255,.22);border-radius:50%;color:#07101d;background:#edf3ff;cursor:pointer;box-shadow:0 7px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .17s ease,background .17s ease}.play-btn:hover{background:#fff}.play-btn:active{transform:scale(.95)}.icon-btn svg,.play-btn svg{width:18px;height:18px;display:block}
button:disabled{opacity:.32;cursor:default;transform:none!important}.step-count{min-width:70px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.speed{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}.speed input{width:90px;accent-color:#dce8ff}.shortcuts{display:flex;gap:4px}
kbd{min-width:24px;height:24px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.105);border-radius:8px;color:#aeb7c7;background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);font:650 10px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.995)}to{opacity:1;transform:none}}@keyframes sheen{from{opacity:0;transform:translateX(-48%)}40%{opacity:1}to{opacity:0;transform:translateX(48%)}}
@media(max-width:960px){.topbar{align-items:flex-start;flex-direction:column}.main-grid{grid-template-columns:1fr}.visual-panel{border-right:0;border-bottom:1px solid var(--line)}.code-panel{min-height:360px}.code-scroll{max-height:400px}}
@media(max-width:680px){.app{width:min(100% - 18px,1260px);padding-top:16px}.brand p{display:none}.segmented{width:100%}.segmented button{flex:1;padding:0 8px}.config{grid-template-columns:1fr}.config-actions .action-btn{flex:1}.scene-head{padding:10px 14px 3px}.step-readout{align-items:flex-start;flex-direction:column;padding:6px 14px 12px}.badges{justify-content:flex-start}.control-wrap{padding:10px 8px 8px}.control-bar{padding:8px;gap:6px;border-radius:18px}.control-left .shortcuts{display:none}.control-right .speed span{display:none}.control-right .speed input{width:65px}.step-count{min-width:54px;font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

.table-row-label{fill:#707a8c;font-size:10px;font-weight:750;text-anchor:end}
.border-box{fill:none;stroke:rgba(169,144,255,.55);stroke-width:2;stroke-dasharray:5 5}
.border-caption{fill:#a990ff;font-size:10px;font-weight:720;text-anchor:middle}
.mode-note{color:var(--muted2);font-size:10px}
@media(max-width:680px){.stage{min-height:355px}}

<body><main class="app" id="app">

    <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>

</section></main>
<script>

function nextTable(p){const m=p.length,a=Array(m+1).fill(0);if(!m)return a;a[1]=0;let i=1,j=0;while(i<m){if(j===0||p[i-1]===p[j-1]){i++;j++;a[i]=j}else j=a[j]}return a}

function traceBF(s,p){let i=1,j=1,cmp=0,out=[{i,j,cmp,line:1,kind:"start",title:"从首字符开始",msg:"i = 1，j = 1。"}],guard=0;while(i<=s.length&&j<=p.length&&guard++<500){cmp++;const eq=s[i-1]===p[j-1];out.push({i,j,cmp,line:3,kind:eq?"match":"mismatch",title:eq?"字符匹配":"发生失配",msg:`S[${i}] = ${s[i-1]}，P[${j}] = ${p[j-1]}：${eq?"相等":"不相等"}。`});if(eq){i++;j++;out.push({i,j,cmp,line:4,kind:"move",title:"双指针前进",msg:`i → ${i}，j → ${j}。`})}else{const oldI=i,oldJ=j;i=i-j+2;j=1;out.push({i,j,cmp,line:6,kind:"shift",title:"主串回退并右移模式串",msg:`i: ${oldI} → ${i}，j: ${oldJ} → 1。`});out.push({i,j,cmp,line:7,kind:"move",title:"从模式串首位重试",msg:"BF 每次失配都把 j 重置为 1。"})}}const ok=j>p.length;out.push({i,j,cmp,line:8,kind:ok?"done":"fail",title:ok?"匹配成功":"匹配失败",msg:ok?`起始位置 = ${i-p.length}（1-based）。`:"主串扫描结束。"});return out}
function traceKMP(s,p,nx){let i=1,j=1,cmp=0,out=[{i,j,cmp,line:2,kind:"start",title:"从首字符开始",msg:"i = 1，j = 1。"}],guard=0;while(i<=s.length&&j<=p.length&&guard++<500){if(j===0){out.push({i,j,cmp,line:4,kind:"jump0",title:"j = 0",msg:"主串前进一位，模式串从首位重新比较。"});i++;j++;out.push({i,j,cmp,line:5,kind:"move",title:"继续比较",msg:`i → ${i}，j → ${j}。`});continue}cmp++;const eq=s[i-1]===p[j-1];out.push({i,j,cmp,line:4,kind:eq?"match":"mismatch",title:eq?"字符匹配":"发生失配",msg:`S[${i}] = ${s[i-1]}，P[${j}] = ${p[j-1]}。`});if(eq){i++;j++;out.push({i,j,cmp,line:5,kind:"move",title:"双指针前进",msg:`i → ${i}，j → ${j}。`})}else{const old=j;j=nx[j];out.push({i,j,cmp,line:7,kind:"fallback",title:"利用 next 回退 j",msg:`i 不回退；j: ${old} → next[${old}] = ${j}。`})}}const ok=j>p.length;out.push({i,j,cmp,line:8,kind:ok?"done":"fail",title:ok?"匹配成功":"匹配失败",msg:ok?`起始位置 = ${i-p.length}（1-based）。`:"主串扫描结束。"});return out}
function traceNext(p,opt=false){const nx=nextTable(p),nv=nextvalTable(p,nx),table=opt?nv:nx,out=[];let i=1,j=0;out.push({i,j,line:1,kind:"set",title:`${opt?"nextval":"next"}[1] = 0`,msg:"初始化表首。",table:[...table].map((v,k)=>k===1?0:null)});let shown=Array(p.length+1).fill(null);shown[1]=0;let guard=0;while(i<p.length&&guard++<300){out.push({i,j,line:3,kind:"compare",title:j===0?"j = 0":"比较前后缀字符",msg:j===0?"直接推进 i、j。":`P[${i}] = ${p[i-1]}，P[${j}] = ${p[j-1]}。`,table:[...shown]});if(j===0||p[i-1]===p[j-1]){i++;j++;let v;if(opt){v=(p[i-1]!==p[j-1])?j:nv[j];shown[i]=v;out.push({i,j,line:(p[i-1]!==p[j-1]?6:7),kind:"set",title:`nextval[${i}] = ${v}`,msg:p[i-1]!==p[j-1]?`P[${i}] 与 P[${j}] 不同，保留 j = ${j}。`:`字符相同，跳过会造成重复比较的位置，取 nextval[${j}] = ${v}。`,table:[...shown]})}else{v=nx[i];shown[i]=v;out.push({i,j,line:6,kind:"set",title:`next[${i}] = ${v}`,msg:`记录最长相等前后缀对应的回退位置 ${v}。`,table:[...shown]})}}else{const old=j;j=nx[j];out.push({i,j,line:opt?9:8,kind:"fallback",title:"j 回退",msg:`j: ${old} → next[${old}] = ${j}。`,table:[...shown]})}}out.push({i:p.length,j,line:0,kind:"done",title:"表构造完成",msg:`${opt?"nextval":"next"} = [${table.slice(1).join(", ")}]`,table:[...table]});return out}
function validate(){const s=E.text.value.trim(),p=E.pat.value.trim();if(!p){E.error.textContent="模式串不能为空。";return null}if(p.length>12){E.error.textContent="模式串最多 12 个字符。";return null}if((mode==="bf"||mode==="kmp")&&!s){E.error.textContent="BF/KMP 模式下主串不能为空。";return null}if(s.length>24){E.error.textContent="主串最多 24 个字符。";return null}if((mode==="bf"||mode==="kmp")&&p.length>s.length){E.error.textContent="模式串长度不能超过主串。";return null}E.error.textContent="";return{s,p}}
function build(){pause();const d=validate();if(!d)return;const nx=nextTable(d.p);steps=mode==="bf"?traceBF(d.s,d.p):mode==="kmp"?traceKMP(d.s,d.p,nx):traceNext(d.p,mode==="nextval");steps.forEach(x=>{x.s=d.s;x.p=d.p;x.nx=nx;x.nv=nextvalTable(d.p,nx)});current=0;render()}

function drawTable(st,opt){E.stage.innerHTML="";const p=st.p,cw=Math.min(52,650/Math.max(1,p.length)),x0=(900-p.length*cw)/2,yP=120,yT=210;for(let k=0;k<p.length;k++){const x=x0+k*cw;let cls="cell";if(k===st.i-1||k===st.j-1)cls+=" hot";E.stage.appendChild(svg("rect",{x,y:yP,width:cw-4,height:42,rx:9,class:cls}));E.stage.appendChild(tx(x+(cw-4)/2,yP+21,p[k],"ch"));E.stage.appendChild(tx(x+(cw-4)/2,yP-10,k+1,"idx"));E.stage.appendChild(svg("rect",{x,y:yT,width:cw-4,height:35,rx:8,class:"cell"}));const v=st.table?.[k+1];E.stage.appendChild(tx(x+(cw-4)/2,yT+18,v==null?"—":v,"table-value"+(k+1===st.i?" hot":"")))}E.stage.appendChild(tx(x0-13,yP+22,"P","row-label"));E.stage.appendChild(tx(x0-13,yT+19,opt?"nextval":"next","row-label"));if(st.i>=1&&st.i<=p.length)E.stage.appendChild(tx(x0+(st.i-1)*cw+(cw-4)/2,yP+70,"i","ptr"));if(st.j>0&&st.j<=p.length)E.stage.appendChild(tx(x0+(st.j-1)*cw+(cw-4)/2,yP+88,"j","ptr"));if(st.i>1&&st.j>1){const len=Math.max(0,st.j-1);if(len>0){E.stage.appendChild(svg("rect",{x:x0,y:yP-3,width:len*cw,height:48,rx:10,class:"border-box"}));E.stage.appendChild(svg("rect",{x:x0+(st.i-st.j)*cw,y:yP-3,width:len*cw,height:48,rx:10,class:"border-box"}));E.stage.appendChild(tx(450,318,"紫色框表示当前候选相等前缀 / 后缀","border-caption"))}}}
function renderCode(st){const arr=codes[mode];E.code.innerHTML="";arr.forEach((it,i)=>{const r=document.createElement("span");r.className="code-line"+(it.k?" "+it.k:"")+(i===st.line?" active":"")+(Math.abs(i-st.line)===1?" near":"");const no=document.createElement("span");no.className="no";no.textContent=it.k?"":String(i+1).padStart(2,"0");const t=document.createElement("span");t.textContent=it.t;r.append(no,t);E.code.appendChild(r)});requestAnimationFrame(()=>E.code.querySelector(".active")?.scrollIntoView({block:"nearest",behavior:reduced?"auto":"smooth"}))}

function update(){E.prev.disabled=current===0;E.next.disabled=current===steps.length-1;E.reset.disabled=current===0&&!playing;E.play.setAttribute("aria-label",playing?"暂停":"播放");E.playIcon.innerHTML=playing?'<path d="M7.7 6.5h3v11h-3zm5.6 0h3v11h-3z" fill="currentColor"/>':'<path d="M8.4 6.7c0-1 1.1-1.6 1.9-1l7.9 5.1c.8.5.8 1.7 0 2.2l-7.9 5.2c-.8.5-1.9-.1-1.9-1V6.7Z" fill="currentColor"/>'}
