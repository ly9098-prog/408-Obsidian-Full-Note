<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>排序可视化 · SVG Motion</title>
<style>
  :root {
    color-scheme: light;
    --bg: #eef1f5;
    --ink: #111318;
    --muted: #69717d;
    --accent: #0a84ff;
    --accent-soft: rgba(10,132,255,.13);
    --glass: rgba(255,255,255,.58);
    --glass-strong: rgba(255,255,255,.78);
    --stroke: rgba(255,255,255,.72);
    --stroke-dark: rgba(18,24,34,.08);
    --shadow: 0 26px 80px rgba(52,66,88,.14), 0 2px 8px rgba(52,66,88,.05);
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 16% 10%, rgba(10,132,255,.13), transparent 31rem),
      radial-gradient(circle at 88% 92%, rgba(73,156,255,.10), transparent 28rem),
      linear-gradient(180deg, #f7f8fa 0%, var(--bg) 100%);
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; opacity: .34;
    background-image: radial-gradient(rgba(20,32,48,.13) .6px, transparent .6px);
    background-size: 18px 18px;
    mask-image: linear-gradient(to bottom, transparent, black 18%, black 78%, transparent);
  }
  .page {
    width: min(1180px, calc(100% - 32px));
    margin: 0 auto;
    padding: clamp(28px, 4vw, 56px) 0 38px;
    opacity: 0;
    transform: translateY(10px);
    animation: pageIn .8s var(--ease) .08s forwards;
  }
  @keyframes pageIn { to { opacity: 1; transform: none; } }
  .masthead {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 22px;
    margin: 0 4px 18px;
  }
  .title-wrap { display: grid; gap: 5px; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase;
    color: var(--accent);
  }
  h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); line-height: 1; letter-spacing: -.045em; font-weight: 720; }
  .kbd-hint { font-size: 12px; color: var(--muted); white-space: nowrap; }
  kbd {
    font: inherit; font-size: 11px; color: #4f5865;
    padding: 3px 7px; border-radius: 7px; border: 1px solid rgba(18,24,34,.09);
    background: rgba(255,255,255,.6); box-shadow: inset 0 1px rgba(255,255,255,.9);
  }
  .glass {
    position: relative;
    background: var(--glass);
    border: 1px solid var(--stroke);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.88);
    backdrop-filter: blur(24px) saturate(145%);
    -webkit-backdrop-filter: blur(24px) saturate(145%);
  }
  .glass::after {
    content: ""; pointer-events: none; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.24);
  }
  .toolbar {
    border-radius: 22px 22px 0 0;
    padding: 12px;
    display: grid;
    grid-template-columns: minmax(240px, auto) 1fr auto;
    gap: 12px;
    align-items: center;
    border-bottom-color: rgba(255,255,255,.3);
  }
  .segmented {
    width: fit-content; display: flex; gap: 4px; padding: 4px;
    border-radius: 13px; background: rgba(110,120,138,.09);
    border: 1px solid rgba(16,24,40,.05);
  }
  button {
    appearance: none; border: 0; font: inherit; color: inherit; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .seg-btn {
    min-height: 34px; padding: 0 13px; border-radius: 10px; background: transparent;
    font-size: 13px; font-weight: 650; color: #68717d;
    transition: background .25s var(--ease), color .25s var(--ease), box-shadow .25s var(--ease), transform .18s var(--ease);
  }
  .seg-btn[aria-selected="true"] {
    background: rgba(255,255,255,.84); color: #161a20;
    box-shadow: 0 1px 1px rgba(0,0,0,.04), 0 5px 14px rgba(38,52,72,.08), inset 0 1px rgba(255,255,255,.9);
  }
  .seg-btn:active, .icon-btn:active, .control-btn:active { transform: scale(.97); }
  .data-strip {
    min-width: 0; display: flex; justify-content: center; align-items: center; gap: 7px;
    overflow: hidden;
  }
  .data-chip {
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 11px; color: #6f7782;
    padding: 5px 8px; border-radius: 8px; background: rgba(255,255,255,.42); border: 1px solid rgba(255,255,255,.58);
  }
  .toolbar-actions { display: flex; gap: 7px; align-items: center; }
  .icon-btn, .speed-btn {
    height: 36px; border-radius: 11px; background: rgba(255,255,255,.54);
    border: 1px solid rgba(255,255,255,.72); color: #3f4854;
    box-shadow: inset 0 1px rgba(255,255,255,.82);
    display: grid; place-items: center; transition: transform .18s var(--ease), background .2s ease;
  }
  .icon-btn { width: 36px; }
  .speed-btn { min-width: 54px; padding: 0 11px; font-size: 12px; font-weight: 700; }
  .icon-btn:hover, .speed-btn:hover { background: rgba(255,255,255,.78); }
  .stage-shell {
    border-radius: 0 0 26px 26px;
    overflow: hidden;
    min-height: 620px;
  }
  #stage { display: block; width: 100%; aspect-ratio: 1200 / 620; min-height: 520px; }
  .statusbar {
    margin-top: 14px; padding: 10px 12px; border-radius: 18px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px;
  }
  .status-text { min-width: 0; display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }
  .status-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
  .status-text strong { color: #242a31; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .controls { display: flex; align-items: center; gap: 7px; }
  .control-btn {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    background: rgba(255,255,255,.60); border: 1px solid rgba(255,255,255,.78);
    box-shadow: 0 5px 18px rgba(43,57,76,.06), inset 0 1px rgba(255,255,255,.9);
    transition: transform .18s var(--ease), background .2s ease, opacity .2s ease;
  }
  .control-btn.primary { width: 46px; height: 46px; border-radius: 15px; background: #171a1f; color: white; border-color: rgba(0,0,0,.12); }
  .control-btn:disabled { cursor: default; opacity: .35; transform: none; }
  .timeline-wrap { justify-self: end; display: flex; align-items: center; gap: 10px; min-width: 160px; }
  .timeline { width: min(220px, 18vw); height: 4px; border-radius: 999px; background: rgba(80,90,105,.13); overflow: hidden; }
  .timeline > i { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width .45s var(--ease); }
  .counter { min-width: 39px; font: 600 11px ui-monospace, "SFMono-Regular", Menlo, monospace; color: #7a828d; text-align: right; }
  button:focus-visible { outline: 3px solid rgba(10,132,255,.28); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  /* SVG */
  .svg-kicker { font: 700 11px -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: .12em; fill: #88919d; }
  .svg-title { font: 700 24px -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -.03em; fill: #171a1f; }
  .svg-meta { font: 500 12px -apple-system, BlinkMacSystemFont, sans-serif; fill: #7f8792; }
  .node { transition: transform .62s var(--ease), opacity .26s ease; will-change: transform; }
  .node .tile { fill: rgba(255,255,255,.90); stroke: rgba(16,24,40,.10); stroke-width: 1; filter: url(#tileShadow); transition: fill .3s ease, stroke .3s ease; }
  .node .value { font: 720 17px ui-monospace, "SFMono-Regular", Menlo, monospace; fill: #1b2027; text-anchor: middle; dominant-baseline: central; letter-spacing: -.03em; }
  .node .digit-dot { fill: var(--accent); opacity: 0; transition: opacity .25s ease; }
  .node .digit-text { fill: white; font: 700 10px ui-monospace, "SFMono-Regular", Menlo, monospace; text-anchor: middle; dominant-baseline: central; opacity: 0; transition: opacity .25s ease; }
  .node.active .tile { stroke: rgba(10,132,255,.48); fill: rgba(241,248,255,.96); }
  .node.active .digit-dot, .node.active .digit-text { opacity: 1; }
  .node.dim { opacity: .38; }
  .guide { transition: opacity .28s ease, transform .45s var(--ease); }
  .bucket-box { fill: rgba(255,255,255,.30); stroke: rgba(23,34,49,.09); stroke-width: 1; }
  .bucket-box.active { stroke: rgba(10,132,255,.30); fill: rgba(10,132,255,.035); }
  .bucket-label, .lane-label { font: 700 11px ui-monospace, "SFMono-Regular", Menlo, monospace; fill: #858d98; text-anchor: middle; }
  .slot { fill: none; stroke: rgba(44,57,75,.11); stroke-width: 1; stroke-dasharray: 4 5; }
  .group-bracket { fill: rgba(10,132,255,.05); stroke: rgba(10,132,255,.20); stroke-width: 1; }
  .ghost-line { stroke: rgba(46,58,75,.11); stroke-width: 1; stroke-dasharray: 4 6; }
  .lane-pill { fill: rgba(255,255,255,.56); stroke: rgba(255,255,255,.78); stroke-width: 1; }
  .lane-pill-text { font: 700 10px -apple-system, BlinkMacSystemFont, sans-serif; fill: #7b8490; text-anchor: middle; dominant-baseline: central; }
  .done-mark { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 28; stroke-dashoffset: 28; animation: check .5s var(--ease) forwards; }
  @keyframes check { to { stroke-dashoffset: 0; } }

  @media (max-width: 760px) {
    .page { width: min(100% - 20px, 1180px); padding-top: 20px; }
    .masthead { align-items: start; }
    .kbd-hint { display: none; }
    .toolbar { grid-template-columns: 1fr auto; }
    .data-strip { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; overflow-x: auto; padding-bottom: 2px; }
    .stage-shell { min-height: 500px; }
    #stage { min-height: 500px; width: 100%; }
    .statusbar { grid-template-columns: 1fr auto; }
    .status-text { grid-column: 1 / -1; }
    .timeline-wrap { justify-self: end; min-width: 120px; }
    .timeline { width: 100px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .glass { background: rgba(249,250,252,.96); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
</style>
</head>
<body>
<main class="page">
  <header class="masthead">
    <div class="title-wrap">
      <div class="eyebrow">SVG Motion Lab</div>
      <h1>排序可视化</h1>
    </div>
    <div class="kbd-hint"><kbd>←</kbd> 上一步 &nbsp; <kbd>→</kbd> 下一步 &nbsp; <kbd>Space</kbd> 播放</div>
  </header>

  <section class="toolbar glass" aria-label="排序控制">
    <div class="segmented" role="tablist" aria-label="算法">
      <button class="seg-btn" id="tab-radix" role="tab" aria-selected="true" data-mode="radix">基数排序</button>
      <button class="seg-btn" id="tab-merge" role="tab" aria-selected="false" data-mode="merge">二路归并</button>
    </div>
    <div class="data-strip" id="dataStrip" aria-label="当前数据"></div>
    <div class="toolbar-actions">
      <button class="speed-btn" id="speedBtn" aria-label="切换播放速度" title="播放速度">1×</button>
      <button class="icon-btn" id="shuffleBtn" aria-label="重新生成数据" title="重新生成数据">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h3.3c4.2 0 5.4 10 9.6 10H20M17 4l3 3-3 3M4 17h3.1c1.4 0 2.4-1.1 3.3-2.6M14.2 8.8c.8-1 1.6-1.8 2.7-1.8H20M17 14l3 3-3 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </section>

  <section class="stage-shell glass">
    <svg id="stage" viewBox="0 0 1200 620" role="img" aria-labelledby="svgTitle svgDesc">
      <title id="svgTitle">排序算法二维动画</title>
      <desc id="svgDesc">使用可移动数字卡片展示基数排序和二路归并排序过程。</desc>
      <defs>
        <filter id="tileShadow" x="-30%" y="-40%" width="160%" height="190%">
          <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#506070" flood-opacity=".12"/>
        </filter>
        <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="1200" height="620" fill="rgba(255,255,255,.12)"/>
      <path d="M0 1H1200" stroke="rgba(255,255,255,.65)"/>
      <g id="guideLayer"></g>
      <g id="nodeLayer"></g>
      <g id="overlayLayer"></g>
    </svg>
  </section>

  <section class="statusbar glass" aria-label="播放控制">
    <div class="status-text"><span class="status-dot" aria-hidden="true"></span><strong id="statusLabel">初始化</strong></div>
    <div class="controls">
      <button class="control-btn" id="prevBtn" aria-label="上一步" title="上一步（←）">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="control-btn primary" id="playBtn" aria-label="播放" title="播放 / 暂停（Space）"></button>
      <button class="control-btn" id="nextBtn" aria-label="下一步" title="下一步（→）">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="timeline-wrap"><div class="timeline"><i id="progress"></i></div><span class="counter" id="counter">01 / 01</span></div>
  </section>
  <div class="sr-only" id="live" aria-live="polite"></div>
</main>

<script>
(() => {
  'use strict';

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const stage = document.getElementById('stage');
  const guideLayer = document.getElementById('guideLayer');
  const nodeLayer = document.getElementById('nodeLayer');
  const overlayLayer = document.getElementById('overlayLayer');
  const statusLabel = document.getElementById('statusLabel');
  const dataStrip = document.getElementById('dataStrip');
  const progress = document.getElementById('progress');
  const counter = document.getElementById('counter');
  const live = document.getElementById('live');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const playBtn = document.getElementById('playBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const speedBtn = document.getElementById('speedBtn');
  const tabs = [...document.querySelectorAll('.seg-btn')];

  const ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 7.4v9.2c0 .8.9 1.2 1.5.8l7-4.6a1 1 0 0 0 0-1.6l-7-4.6c-.6-.4-1.5 0-1.5.8Z" fill="currentColor"/></svg>';
  const ICON_PAUSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8.5 7v10M15.5 7v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  let values = [329, 457, 657, 839, 436, 720, 355];
  let mode = 'radix';
  let frames = [];
  let index = 0;
  let timer = null;
  let speedIndex = 1;
  const speeds = [1400, 900, 570];
  const speedNames = ['0.7×', '1×', '1.6×'];
  const nodes = new Map();

  const $svg = (tag, attrs = {}, text = '') => {
    const el = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (text !== '') el.textContent = text;
    return el;
  };

  const digitAt = (n, exp) => Math.floor(n / exp) % 10;
  const cloneItems = items => items.map(x => ({...x}));
  const createItems = arr => arr.map((value, i) => ({ id: `n${i}`, value }));
  const rowPositions = (items, y = 176) => {
    const gap = 98;
    const total = (items.length - 1) * gap;
    const start = 600 - total / 2;
    return Object.fromEntries(items.map((item, i) => [item.id, { x: start + i * gap, y }]));
  };

  function buildRadixFrames(arr) {
    let items = createItems(arr);
    const out = [];
    out.push({
      title: '基数排序', kicker: 'LSD · BASE 10', meta: '从最低位开始，保持稳定顺序',
      label: '初始序列', items: cloneItems(items), positions: rowPositions(items), kind: 'row', activeIds: []
    });
    const max = Math.max(...arr);
    const digitCount = String(max).length;
    const names = ['个位', '十位', '百位', '千位'];

    for (let d = 0, exp = 1; d < digitCount; d++, exp *= 10) {
      out.push({
        title: `读取${names[d] || `${exp}位`}`, kicker: `PASS ${d + 1} / ${digitCount}`, meta: `按 ${exp} 位数字分配到 0–9 桶`,
        label: `读取${names[d] || '当前位'}`, items: cloneItems(items), positions: rowPositions(items), kind: 'row', exp,
        activeIds: items.map(x => x.id)
      });

      const buckets = Array.from({length: 10}, () => []);
      items.forEach(item => buckets[digitAt(item.value, exp)].push(item));
      const positions = {};
      buckets.forEach((bucket, b) => {
        bucket.forEach((item, stack) => {
          positions[item.id] = { x: 127 + b * 105, y: 356 + stack * 62 };
        });
      });
      out.push({
        title: `分配到桶`, kicker: `PASS ${d + 1} / ${digitCount}`, meta: `相同数字按原有先后次序排列`,
        label: `按${names[d] || '当前位'}分桶`, items: cloneItems(items), positions, kind: 'buckets', exp,
        activeIds: items.map(x => x.id), buckets: buckets.map(b => b.map(x => x.id))
      });

      items = buckets.flat();
      out.push({
        title: '稳定收集', kicker: `PASS ${d + 1} / ${digitCount}`, meta: items.map(x => x.value).join('  ·  '),
        label: `完成第 ${d + 1} 轮`, items: cloneItems(items), positions: rowPositions(items), kind: 'collect', exp,
        activeIds: items.map(x => x.id)
      });
    }
    out.push({
      title: '排序完成', kicker: 'RESULT', meta: items.map(x => x.value).join('  ·  '), label: '升序完成',
      items: cloneItems(items), positions: rowPositions(items), kind: 'done', activeIds: items.map(x => x.id)
    });
    return out;
  }

  function buildMergeFrames(arr) {
    const base = createItems(arr);
    let current = cloneItems(base);
    const operations = [];

    function sortSegment(segment, start) {
      if (segment.length <= 1) return cloneItems(segment);
      const mid = Math.ceil(segment.length / 2);
      const left = sortSegment(segment.slice(0, mid), start);
      const right = sortSegment(segment.slice(mid), start + mid);
      const merged = [];
      let i = 0, j = 0;
      while (i < left.length || j < right.length) {
        if (j >= right.length || (i < left.length && left[i].value <= right[j].value)) merged.push(left[i++]);
        else merged.push(right[j++]);
      }
      operations.push({ start, length: segment.length, left: cloneItems(left), right: cloneItems(right), merged: cloneItems(merged) });
      return merged;
    }
    sortSegment(base, 0);

    const out = [{
      title: '二路归并', kicker: 'MERGE SORT', meta: '拆分到单元素，再成对有序合并', label: '初始序列',
      items: cloneItems(current), positions: rowPositions(current), kind: 'row', activeIds: []
    }];

    for (let opIndex = 0; opIndex < operations.length; opIndex++) {
      const op = operations[opIndex];
      const before = cloneItems(current);
      const basePos = rowPositions(before, 156);
      const segIds = new Set(before.slice(op.start, op.start + op.length).map(x => x.id));
      const segmentXs = before.slice(op.start, op.start + op.length).map(x => basePos[x.id].x);
      const minX = Math.min(...segmentXs), maxX = Math.max(...segmentXs);
      const width = Math.max(94, maxX - minX);
      const center = (minX + maxX) / 2;
      const positions = {...basePos};
      const placeLane = (list, y, laneShift) => {
        const gap = Math.min(92, Math.max(66, width / Math.max(list.length - 1, 1)));
        const startX = center - ((list.length - 1) * gap) / 2 + laneShift;
        list.forEach((item, idx) => positions[item.id] = {x: startX + idx * gap, y});
      };
      placeLane(op.left, 316, -18);
      placeLane(op.right, 430, 18);

      out.push({
        title: '拆为两路', kicker: `MERGE ${opIndex + 1} / ${operations.length}`,
        meta: `[${op.left.map(x => x.value).join(', ')}]  +  [${op.right.map(x => x.value).join(', ')}]`,
        label: `比较并合并 ${op.length} 个元素`, items: before, positions, kind: 'merge-work',
        activeIds: [...segIds], leftIds: op.left.map(x => x.id), rightIds: op.right.map(x => x.id), range: {minX, maxX}
      });

      const mergedCurrent = current.slice();
      mergedCurrent.splice(op.start, op.length, ...op.merged);
      current = mergedCurrent;
      const afterPos = rowPositions(current, 176);
      const afterXs = current.slice(op.start, op.start + op.length).map(x => afterPos[x.id].x);
      out.push({
        title: '有序合并', kicker: `MERGE ${opIndex + 1} / ${operations.length}`,
        meta: op.merged.map(x => x.value).join('  <  '),
        label: `完成 ${op.length} 元素归并`, items: cloneItems(current), positions: afterPos, kind: 'merge-done',
        activeIds: op.merged.map(x => x.id), range: {minX: Math.min(...afterXs), maxX: Math.max(...afterXs)}
      });
    }

    out.push({
      title: '排序完成', kicker: 'RESULT', meta: current.map(x => x.value).join('  ·  '), label: '升序完成',
      items: cloneItems(current), positions: rowPositions(current), kind: 'done', activeIds: current.map(x => x.id)
    });
    return out;
  }

  function addHeader(frame) {
    const kicker = $svg('text', {x: 62, y: 63, class: 'svg-kicker'}, frame.kicker);
    const title = $svg('text', {x: 62, y: 96, class: 'svg-title'}, frame.title);
    const meta = $svg('text', {x: 62, y: 122, class: 'svg-meta'}, frame.meta);
    overlayLayer.append(kicker, title, meta);
  }

  function drawGuides(frame) {
    guideLayer.replaceChildren();
    overlayLayer.replaceChildren();
    addHeader(frame);

    if (frame.kind === 'buckets') {
      for (let b = 0; b < 10; b++) {
        const x = 80 + b * 105;
        const g = $svg('g', {class: 'guide'});
        const active = frame.buckets[b].length > 0 ? ' active' : '';
        g.append(
          $svg('rect', {x, y: 266, width: 94, height: 254, rx: 18, class: `bucket-box${active}`}),
          $svg('text', {x: x + 47, y: 292, class: 'bucket-label'}, String(b))
        );
        guideLayer.append(g);
      }
    } else if (frame.kind === 'merge-work') {
      const x = Math.max(44, frame.range.minX - 55);
      const w = Math.min(1112, frame.range.maxX - frame.range.minX + 110);
      guideLayer.append(
        $svg('rect', {x, y: 130, width: w, height: 61, rx: 20, class: 'group-bracket'}),
        $svg('line', {x1: x + 18, y1: 236, x2: x + w - 18, y2: 236, class: 'ghost-line'}),
        $svg('line', {x1: x + 18, y1: 373, x2: x + w - 18, y2: 373, class: 'ghost-line'})
      );
      const leftPill = $svg('g');
      leftPill.append($svg('rect', {x: 62, y: 295, width: 46, height: 24, rx: 12, class: 'lane-pill'}), $svg('text', {x: 85, y: 307, class: 'lane-pill-text'}, 'LEFT'));
      const rightPill = $svg('g');
      rightPill.append($svg('rect', {x: 62, y: 409, width: 52, height: 24, rx: 12, class: 'lane-pill'}), $svg('text', {x: 88, y: 421, class: 'lane-pill-text'}, 'RIGHT'));
      guideLayer.append(leftPill, rightPill);
      beforeSlots(frame).forEach(s => guideLayer.append($svg('rect', {x: s.x - 36, y: 133, width: 72, height: 56, rx: 16, class: 'slot'})));
    } else if (frame.kind === 'merge-done') {
      const x = Math.max(44, frame.range.minX - 55);
      const w = Math.min(1112, frame.range.maxX - frame.range.minX + 110);
      guideLayer.append($svg('rect', {x, y: 140, width: w, height: 76, rx: 22, class: 'group-bracket'}));
    } else if (frame.kind === 'done') {
      const cx = 1112, cy = 78;
      const circle = $svg('circle', {cx, cy, r: 20, fill: 'rgba(10,132,255,.08)', stroke: 'rgba(10,132,255,.22)'});
      const path = $svg('path', {d: `M${cx-8} ${cy} l6 6 11-13`, class: 'done-mark'});
      overlayLayer.append(circle, path);
    }
  }

  function beforeSlots(frame) {
    const ids = [...frame.leftIds, ...frame.rightIds];
    const xs = ids.map(id => frame.positions[id].x).sort((a,b) => a-b);
    if (!xs.length) return [];
    const min = frame.range.minX, max = frame.range.maxX;
    const count = ids.length;
    if (count === 1) return [{x:(min+max)/2}];
    const gap = (max - min) / Math.max(count - 1, 1);
    return Array.from({length: count}, (_, i) => ({x: min + i * gap}));
  }

  function ensureNode(item, ordinal) {
    let g = nodes.get(item.id);
    if (g) return g;
    g = $svg('g', {class: 'node', 'data-id': item.id, transform: 'translate(600 250)'});
    g.style.opacity = '0';
    const rect = $svg('rect', {x: -36, y: -28, width: 72, height: 56, rx: 17, class: 'tile'});
    const text = $svg('text', {x: 0, y: -1, class: 'value'}, String(item.value));
    const dot = $svg('circle', {cx: 27, cy: -20, r: 10, class: 'digit-dot'});
    const dText = $svg('text', {x: 27, y: -20, class: 'digit-text'}, '0');
    g.append(rect, text, dot, dText);
    nodeLayer.append(g);
    nodes.set(item.id, g);
    requestAnimationFrame(() => {
      g.style.transitionDelay = `${Math.min(ordinal * 38, 220)}ms`;
      g.style.opacity = '1';
      setTimeout(() => { g.style.transitionDelay = '0ms'; }, 500);
    });
    return g;
  }

  function renderFrame(announce = true) {
    const frame = frames[index];
    drawGuides(frame);
    const active = new Set(frame.activeIds || []);
    const itemIds = new Set(frame.items.map(x => x.id));

    for (const [id, g] of nodes) {
      if (!itemIds.has(id)) { g.remove(); nodes.delete(id); }
    }

    frame.items.forEach((item, ordinal) => {
      const g = ensureNode(item, ordinal);
      const pos = frame.positions[item.id] || {x:600, y:176};
      g.setAttribute('transform', `translate(${pos.x} ${pos.y})`);
      g.classList.toggle('active', active.has(item.id));
      g.classList.toggle('dim', frame.kind === 'merge-work' && !active.has(item.id));
      const digitText = g.querySelector('.digit-text');
      if (frame.exp) digitText.textContent = String(digitAt(item.value, frame.exp));
    });

    statusLabel.textContent = frame.label;
    const pct = frames.length <= 1 ? 0 : (index / (frames.length - 1)) * 100;
    progress.style.width = `${pct}%`;
    counter.textContent = `${String(index + 1).padStart(2,'0')} / ${String(frames.length).padStart(2,'0')}`;
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === frames.length - 1;
    if (announce) live.textContent = `${frame.label}，第 ${index + 1} 步，共 ${frames.length} 步`;
  }

  function renderDataStrip() {
    dataStrip.replaceChildren();
    values.forEach(v => {
      const chip = document.createElement('span');
      chip.className = 'data-chip';
      chip.textContent = v;
      dataStrip.append(chip);
    });
  }

  function rebuild() {
    stop();
    index = 0;
    nodes.forEach(n => n.remove());
    nodes.clear();
    frames = mode === 'radix' ? buildRadixFrames(values) : buildMergeFrames(values);
    renderDataStrip();
    renderFrame(false);
  }

  function step(delta) {
    const next = Math.max(0, Math.min(frames.length - 1, index + delta));
    if (next === index) return;
    index = next;
    renderFrame();
    if (index === frames.length - 1 && timer) stop();
  }

  function play() {
    if (timer) { stop(); return; }
    if (index === frames.length - 1) { index = 0; renderFrame(false); }
    playBtn.innerHTML = ICON_PAUSE;
    playBtn.setAttribute('aria-label', '暂停');
    timer = setInterval(() => {
      if (index >= frames.length - 1) { stop(); return; }
      step(1);
    }, speeds[speedIndex]);
  }

  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
    playBtn.innerHTML = ICON_PLAY;
    playBtn.setAttribute('aria-label', '播放');
  }

  function shuffle() {
    values = Array.from({length: 7}, () => Math.floor(120 + Math.random() * 780));
    rebuild();
  }

  prevBtn.addEventListener('click', () => { stop(); step(-1); });
  nextBtn.addEventListener('click', () => { stop(); step(1); });
  playBtn.addEventListener('click', play);
  shuffleBtn.addEventListener('click', shuffle);
  speedBtn.addEventListener('click', () => {
    speedIndex = (speedIndex + 1) % speeds.length;
    speedBtn.textContent = speedNames[speedIndex];
    if (timer) { stop(); play(); }
  });
  tabs.forEach(tab => tab.addEventListener('click', () => {
    const nextMode = tab.dataset.mode;
    if (nextMode === mode) return;
    mode = nextMode;
    tabs.forEach(t => t.setAttribute('aria-selected', String(t.dataset.mode === mode)));
    rebuild();
  }));

  document.addEventListener('keydown', (e) => {
    const target = e.target;
    if (target && /input|textarea|select/i.test(target.tagName)) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); stop(); step(1); }
    else if (e.code === 'Space') { e.preventDefault(); play(); }
    else if (e.key.toLowerCase() === 'r') { e.preventDefault(); rebuild(); }
  });

  speedBtn.textContent = speedNames[speedIndex];
  playBtn.innerHTML = ICON_PLAY;
  rebuild();
})();
</script>
