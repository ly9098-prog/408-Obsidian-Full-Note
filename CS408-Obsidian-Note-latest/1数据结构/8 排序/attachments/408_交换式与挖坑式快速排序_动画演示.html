<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>考研 408｜快速排序动画</title>
<style>
:root{
  --bg:#090b10;
  --bg-2:#0d1018;
  --surface:#12151d;
  --surface-2:#171b24;
  --glass:rgba(28,31,40,.58);
  --glass-strong:rgba(36,40,50,.72);
  --line:rgba(255,255,255,.095);
  --line-strong:rgba(255,255,255,.16);
  --text:#f5f7fb;
  --muted:#9aa3b5;
  --muted-2:#6f788b;
  --accent:#78a7ff;
  --accent-soft:rgba(120,167,255,.16);
  --pivot:#ffbd6b;
  --pivot-soft:rgba(255,189,107,.14);
  --move:#a78bfa;
  --move-soft:rgba(167,139,250,.14);
  --done:#69d6a0;
  --done-soft:rgba(105,214,160,.13);
  --danger:#ff7a8a;
  --radius-xl:28px;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-pill:999px;
  --shadow:0 28px 80px rgba(0,0,0,.34);
  --ease:cubic-bezier(.22,.8,.22,1);
  --stage-w:980px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:
    radial-gradient(55rem 32rem at 12% -8%,rgba(93,118,255,.14),transparent 62%),
    radial-gradient(42rem 26rem at 94% 3%,rgba(77,215,177,.09),transparent 68%),
    linear-gradient(180deg,#0b0d13 0%,#090b10 72%);
  letter-spacing:-.01em;
}
button,input{font:inherit}
button{color:inherit}
.app{
  width:min(1180px,calc(100% - 32px));
  margin:0 auto;
  padding:28px 0 38px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  min-width:0;
  margin-bottom:18px;
  animation:enter .7s var(--ease) both;
}
.brand{min-width:0}
.brand h1{
  margin:0;
  font-size:clamp(25px,3.2vw,38px);
  line-height:1.04;
  font-weight:720;
  letter-spacing:-.045em;
}
.brand p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:13px;
  font-weight:520;
}
.segmented{
  display:flex;
  padding:4px;
  gap:4px;
  flex:0 0 auto;
  border:1px solid var(--line);
  border-radius:var(--radius-pill);
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(150%);
  backdrop-filter:blur(24px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.segmented button{
  min-height:38px;
  padding:0 16px;
  border:0;
  border-radius:var(--radius-pill);
  background:transparent;
  color:var(--muted);
  font-size:13px;
  font-weight:650;
  cursor:pointer;
  transition:background .24s var(--ease),color .24s var(--ease),transform .18s ease;
}
.segmented button[aria-selected="true"]{
  background:rgba(255,255,255,.11);
  color:var(--text);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 5px 14px rgba(0,0,0,.15);
}
.segmented button:active{transform:scale(.97)}
.segmented button:focus-visible,
.icon-btn:focus-visible,
.action-btn:focus-visible,
.input-shell input:focus-visible{
  outline:2px solid rgba(126,173,255,.82);
  outline-offset:2px;
}

.workspace{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--radius-xl);
  background:
    radial-gradient(48rem 23rem at 50% -18%,rgba(107,131,255,.105),transparent 65%),
    linear-gradient(180deg,rgba(20,23,31,.96),rgba(13,16,23,.985));
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.04);
  animation:enter .76s .07s var(--ease) both;
}
.workspace::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.023) 45%,transparent 68%);
  transform:translateX(-45%);
  animation:sheen 1.1s .28s var(--ease) both;
}
.toolbar{
  position:relative;
  z-index:3;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  padding:14px 14px 8px;
}
.input-shell{
  min-width:0;
  display:flex;
  align-items:center;
  gap:8px;
  padding:5px 6px 5px 14px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(255,255,255,.035);
  transition:border-color .2s ease,background .2s ease;
}
.input-shell:focus-within{
  border-color:rgba(120,167,255,.34);
  background:rgba(120,167,255,.045);
}
.input-shell .label{
  flex:0 0 auto;
  color:var(--muted-2);
  font-size:11px;
  font-weight:700;
  letter-spacing:.02em;
  text-transform:uppercase;
}
.input-shell input{
  min-width:0;
  width:100%;
  height:34px;
  border:0;
  outline:0;
  color:var(--text);
  background:transparent;
  font-size:14px;
  font-variant-numeric:tabular-nums;
}
.input-shell input::placeholder{color:#616a7b}
.mini-actions{display:flex;gap:7px}
.action-btn,.icon-btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.055);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055);
  cursor:pointer;
  transition:transform .18s ease,background .18s ease,border-color .18s ease,opacity .18s ease;
}
.action-btn:hover,.icon-btn:hover{background:rgba(255,255,255,.085);border-color:var(--line-strong)}
.action-btn:active,.icon-btn:active{transform:scale(.96)}
.action-btn{
  height:44px;
  padding:0 14px;
  border-radius:13px;
  font-size:12px;
  font-weight:680;
  white-space:nowrap;
}
.action-btn.primary{
  color:#08101d;
  border-color:transparent;
  background:#d8e5ff;
}
.action-btn.primary:hover{background:#e3ecff}
.icon-btn{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:50%;
  padding:0;
}
.icon-btn svg,.play-btn svg{width:18px;height:18px;display:block}
button:disabled{opacity:.34;cursor:default;transform:none!important}

.error{
  position:relative;
  z-index:2;
  min-height:22px;
  margin:0 18px;
  color:#ff9aa5;
  font-size:12px;
  line-height:1.5;
}
.stage-scroll{
  position:relative;
  z-index:1;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.16) transparent;
}
.stage-scroll::-webkit-scrollbar{height:7px}
.stage-scroll::-webkit-scrollbar-track{background:transparent}
.stage-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:999px}
.stage{
  display:block;
  width:max(100%,var(--stage-w));
  height:auto;
  min-height:360px;
}
.grid-line{stroke:rgba(255,255,255,.048);stroke-width:1}
.baseline{stroke:rgba(255,255,255,.11);stroke-width:1}
.range-line{stroke:rgba(120,167,255,.58);stroke-width:2;stroke-linecap:round}
.range-cap{fill:rgba(120,167,255,.68)}
.range-label{fill:#91b8ff;font-size:11px;font-weight:700;letter-spacing:.02em}
.slot{
  fill:rgba(255,255,255,.024);
  stroke:rgba(255,255,255,.065);
  stroke-width:1;
}
.slot.in-range{fill:rgba(120,167,255,.028)}
.slot.sorted{fill:var(--done-soft);stroke:rgba(105,214,160,.25)}
.slot.hole{
  fill:url(#holePattern);
  stroke:rgba(255,189,107,.65);
  stroke-width:1.5;
  stroke-dasharray:5 5;
}
.slot.focus{stroke:rgba(120,167,255,.44);stroke-width:1.5}
.slot.swap{stroke:rgba(167,139,250,.58);stroke-width:1.5}
.index-label{
  fill:#596275;
  font-size:10px;
  font-weight:650;
  text-anchor:middle;
  font-variant-numeric:tabular-nums;
}
.value-bar{
  fill:#70819c;
  stroke:rgba(255,255,255,.08);
  stroke-width:1;
  transition:fill .25s ease,stroke .25s ease,filter .25s ease;
}
.token.focus .value-bar{fill:#77a8ff;stroke:rgba(168,201,255,.5)}
.token.swap .value-bar{fill:#a88cff;stroke:rgba(205,190,255,.48)}
.token.pivot .value-bar{fill:#ffb961;stroke:rgba(255,215,159,.5)}
.token.sorted .value-bar{fill:#65c996;stroke:rgba(163,236,199,.36)}
.token.held .value-bar{fill:#ffb961;stroke:rgba(255,215,159,.52);filter:drop-shadow(0 10px 18px rgba(255,173,70,.13))}
.value-label{
  fill:#f6f8fc;
  font-size:13px;
  font-weight:760;
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
  font-variant-numeric:tabular-nums;
}
.token.held .value-label{font-size:12px}
.ptr-badge circle{
  fill:rgba(255,255,255,.075);
  stroke:rgba(255,255,255,.08);
}
.ptr-badge.i circle{fill:rgba(120,167,255,.17);stroke:rgba(120,167,255,.36)}
.ptr-badge.j circle{fill:rgba(167,139,250,.17);stroke:rgba(167,139,250,.34)}
.ptr-badge.both circle{fill:rgba(255,122,138,.17);stroke:rgba(255,122,138,.38)}
.ptr-badge text{
  fill:#dce5f5;
  font-size:10px;
  font-weight:780;
  text-anchor:middle;
  dominant-baseline:middle;
}
.pivot-caption{
  fill:#c68d48;
  font-size:10px;
  font-weight:700;
  text-anchor:middle;
}
.hole-caption{
  fill:#b98649;
  font-size:10px;
  font-weight:700;
  text-anchor:middle;
}
.stage-empty{fill:#7f899b;font-size:13px;text-anchor:middle}

.readout{
  position:relative;
  z-index:3;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  min-height:84px;
  padding:4px 20px 14px;
}
.readout-main{min-width:0}
.eyebrow{
  color:var(--muted-2);
  font-size:10px;
  font-weight:760;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.step-title{
  margin-top:4px;
  font-size:17px;
  font-weight:690;
  letter-spacing:-.02em;
}
.step-message{
  max-width:720px;
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}
.metrics{
  display:flex;
  align-items:center;
  gap:16px;
  flex:0 0 auto;
  color:var(--muted);
  font-size:11px;
  font-variant-numeric:tabular-nums;
}
.metric strong{display:block;margin-top:2px;color:#e7ebf2;font-size:13px;font-weight:680}
.metric .k{white-space:nowrap}

.control-wrap{
  position:relative;
  z-index:4;
  padding:0 14px 14px;
}
.control-bar{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
  min-height:70px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:22px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(28px) saturate(155%);
  backdrop-filter:blur(28px) saturate(155%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.075),0 14px 34px rgba(0,0,0,.18);
}
.control-left,.control-right,.transport{display:flex;align-items:center;gap:8px}
.control-right{justify-content:flex-end}
.transport{justify-content:center}
.play-btn{
  width:50px;
  height:50px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.22);
  border-radius:50%;
  color:#07101d;
  background:#edf3ff;
  cursor:pointer;
  box-shadow:0 7px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .2s var(--ease),background .18s ease;
}
.play-btn:hover{background:#fff}
.play-btn:active{transform:scale(.94)}
.step-count{
  min-width:74px;
  color:var(--muted);
  font-size:11px;
  font-variant-numeric:tabular-nums;
}
.speed-group{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--muted);
  font-size:11px;
}
.speed-group input{
  width:96px;
  accent-color:#dce8ff;
}
kbd{
  min-width:24px;
  height:24px;
  padding:0 7px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.105);
  border-radius:8px;
  color:#aeb7c7;
  background:rgba(255,255,255,.055);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  font:650 10px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
}
.shortcuts{
  display:flex;
  gap:4px;
  align-items:center;
}
.progress{
  height:2px;
  margin:0 22px;
  overflow:hidden;
  border-radius:999px;
  background:rgba(255,255,255,.055);
}
.progress > div{
  width:0;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,#78a7ff,#9c8eff);
  transition:width .35s var(--ease);
}

@keyframes enter{
  from{opacity:0;transform:translateY(12px) scale(.995)}
  to{opacity:1;transform:none}
}
@keyframes sheen{
  from{opacity:0;transform:translateX(-45%)}
  40%{opacity:1}
  to{opacity:0;transform:translateX(45%)}
}
@media (hover:hover) and (pointer:fine){
  .workspace:hover{border-color:rgba(255,255,255,.12)}
}
@media (max-width:760px){
  .app{width:min(100% - 18px,1180px);padding-top:16px}
  .topbar{align-items:flex-start;flex-direction:column}
  .segmented{width:100%}
  .segmented button{flex:1;padding:0 10px}
  .toolbar{grid-template-columns:1fr}
  .mini-actions{justify-content:flex-end}
  .readout{align-items:flex-start;flex-direction:column;padding:6px 16px 12px}
  .metrics{width:100%;justify-content:space-between}
  .control-bar{grid-template-columns:1fr auto 1fr}
  .control-left .shortcuts{display:none}
  .speed-group span{display:none}
  .speed-group input{width:72px}
  .stage{min-height:330px}
}
@media (max-width:520px){
  .brand p{display:none}
  .toolbar{padding:10px 10px 4px}
  .input-shell{grid-column:1/-1}
  .mini-actions{width:100%}
  .action-btn{flex:1}
  .control-wrap{padding:0 8px 8px}
  .control-bar{padding:8px;gap:6px;border-radius:18px}
  .control-left,.control-right,.transport{gap:5px}
  .control-left .icon-btn:first-child{display:none}
  .control-right .speed-group{display:none}
  .step-count{min-width:56px;font-size:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <h1>快速排序</h1>
      <p id="algoSubtitle">交换式划分 · 双指针寻找错位元素并交换</p>
    </div>
    <div class="segmented" role="tablist" aria-label="快速排序划分方式">
      <button type="button" role="tab" aria-selected="true" data-algo="exchange">交换式</button>
      <button type="button" role="tab" aria-selected="false" data-algo="hole">挖坑式</button>
    </div>
  </header>

  <section class="workspace" aria-label="快速排序动画演示">
    <div class="toolbar">
      <label class="input-shell">
        <span class="label">Array</span>
        <input id="arrayInput" type="text" autocomplete="off" spellcheck="false"
               value="49, 38, 65, 97, 76, 13, 27, 49"
               aria-label="待排序整数序列">
      </label>
      <div class="mini-actions">
        <button type="button" class="action-btn" id="randomBtn">随机</button>
        <button type="button" class="action-btn primary" id="applyBtn">应用</button>
      </div>
    </div>

    <div class="error" id="error" aria-live="polite"></div>

    <div class="stage-scroll" id="stageScroll">
      <svg class="stage" id="stage" viewBox="0 0 980 360" role="img" aria-label="快速排序 SVG 动画">
        <defs>
          <pattern id="holePattern" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="9" height="9" fill="rgba(255,189,107,.035)"></rect>
            <rect width="2" height="9" fill="rgba(255,189,107,.14)"></rect>
          </pattern>
        </defs>
        <g id="gridLayer"></g>
        <g id="rangeLayer"></g>
        <g id="slotLayer"></g>
        <g id="tokenLayer"></g>
        <g id="pointerLayer"></g>
      </svg>
    </div>

    <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>

    <div class="readout">
      <div class="readout-main">
        <div class="eyebrow" id="stepEyebrow">STEP 1</div>
        <div class="step-title" id="stepTitle">准备</div>
        <div class="step-message" id="stepMessage" aria-live="polite"></div>
      </div>
      <div class="metrics" aria-label="当前统计">
        <div class="metric"><span class="k">区间</span><strong id="rangeMetric">—</strong></div>
        <div class="metric"><span class="k">pivot</span><strong id="pivotMetric">—</strong></div>
        <div class="metric"><span class="k">比较</span><strong id="compareMetric">0</strong></div>
        <div class="metric"><span class="k" id="opMetricLabel">交换</span><strong id="opMetric">0</strong></div>
      </div>
    </div>

    <div class="control-wrap">
      <div class="control-bar" aria-label="动画控制">
        <div class="control-left">
          <button type="button" class="icon-btn" id="resetBtn" aria-label="重置" aria-keyshortcuts="R" title="重置（R）">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4.8 8.1A8 8 0 1 1 4 14m.8-5.9V4.4m0 3.7h3.7"/></svg>
          </button>
          <div class="shortcuts" aria-label="键盘快捷键">
            <kbd>←</kbd><kbd>→</kbd><kbd>Space</kbd>
          </div>
        </div>

        <div class="transport">
          <button type="button" class="icon-btn" id="prevBtn" aria-label="上一步" aria-keyshortcuts="ArrowLeft" title="上一步（←）">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M14.8 6.5 9.3 12l5.5 5.5"/></svg>
          </button>
          <button type="button" class="play-btn" id="playBtn" aria-label="播放" aria-keyshortcuts="Space" title="播放 / 暂停（Space）">
            <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.4 6.7c0-1 1.1-1.6 1.9-1l7.9 5.1c.8.5.8 1.7 0 2.2l-7.9 5.2c-.8.5-1.9-.1-1.9-1V6.7Z" fill="currentColor"/></svg>
          </button>
          <button type="button" class="icon-btn" id="nextBtn" aria-label="下一步" aria-keyshortcuts="ArrowRight" title="下一步（→）">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="m9.2 6.5 5.5 5.5-5.5 5.5"/></svg>
          </button>
        </div>

        <div class="control-right">
          <span class="step-count" id="stepCount">1 / 1</span>
          <label class="speed-group">
            <span>速度</span>
            <input id="speedRange" type="range" min="1" max="5" value="3" step="1" aria-label="播放速度">
          </label>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const app = $("app");
  if (app.dataset.ready === "1") return;
  app.dataset.ready = "1";

  const els = {
    stage:$("stage"), grid:$("gridLayer"), range:$("rangeLayer"),
    slots:$("slotLayer"), tokens:$("tokenLayer"), pointers:$("pointerLayer"),
    input:$("arrayInput"), error:$("error"), apply:$("applyBtn"), random:$("randomBtn"),
    prev:$("prevBtn"), next:$("nextBtn"), play:$("playBtn"), playIcon:$("playIcon"),
    reset:$("resetBtn"), speed:$("speedRange"),
    progress:$("progressBar"), title:$("stepTitle"), message:$("stepMessage"),
    eyebrow:$("stepEyebrow"), stepCount:$("stepCount"),
    rangeMetric:$("rangeMetric"), pivotMetric:$("pivotMetric"),
    compareMetric:$("compareMetric"), opMetric:$("opMetric"), opLabel:$("opMetricLabel"),
    subtitle:$("algoSubtitle"), scroll:$("stageScroll")
  };

  const NS = "http://www.w3.org/2000/svg";
  const speedMs = {1:1400,2:1050,3:760,4:500,5:310};
  const motionMs = {1:640,2:560,3:470,4:380,5:285};
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let algo = "exchange";
  let original = [];
  let steps = [];
  let current = 0;
  let playing = false;
  let playTimer = null;
  let animationFrame = null;
  let animating = false;
  let tokenNodes = new Map();
  let tokenPositions = new Map();
  let renderSerial = 0;

  function svg(name, attrs={}) {
    const node = document.createElementNS(NS,name);
    Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k,String(v)));
    return node;
  }

  function makeTokens(values){
    return values.map((value,index)=>({id:`t${index}`,value}));
  }

  function cloneCells(cells){
    return cells.map(t => t ? {id:t.id,value:t.value} : null);
  }

  function snapshot(cells,data,sorted,metrics,pivotToken){
    return Object.assign({
      cells:cloneCells(cells),
      low:null,high:null,i:null,j:null,
      pivot:null,pivotIndex:null,hole:null,
      pivotToken:pivotToken ? {id:pivotToken.id,value:pivotToken.value} : null,
      focus:[],kind:"idle",title:"",message:"",
      sorted:[...sorted],
      comparisons:metrics.comparisons,
      operations:metrics.operations
    },data);
  }

  function generateExchange(values){
    const a=makeTokens(values);
    const s=[];
    const sorted=new Set();
    const metrics={comparisons:0,operations:0};

    const add=data=>{
      const p = data.pivotToken || (
        data.pivotIndex != null && a[data.pivotIndex] ? a[data.pivotIndex] :
        (data.low != null && a[data.low] ? a[data.low] : null)
      );
      s.push(snapshot(a,data,sorted,metrics,p));
    };

    function qs(low,high){
      if(low>high) return;
      add({
        low,high,i:low,j:high,kind:"range",title:"进入子表",
        message:`处理 A[${low}…${high}]。`
      });

      if(low===high){
        sorted.add(low);
        add({
          low,high,i:low,j:high,pivot:a[low].value,pivotIndex:low,
          kind:"done",title:"位置确定",
          message:`${a[low].value} 已位于最终位置。`
        });
        return;
      }

      let i=low,j=high;
      const pivotToken=a[low];
      const pivot=pivotToken.value;

      add({
        low,high,i,j,pivot,pivotIndex:low,pivotToken,
        kind:"pivot",title:"选择 pivot",
        message:`以 A[${low}] = ${pivot} 为枢轴。`
      });

      while(i<j){
        while(i<j){
          metrics.comparisons++;
          const ok=a[j].value>=pivot;
          add({
            low,high,i,j,pivot,pivotIndex:a.findIndex(x=>x.id===pivotToken.id),pivotToken,
            focus:[j],kind:"compare",title:"右侧扫描",
            message:`${a[j].value} ${ok?"≥":"<"} ${pivot}${ok?"，j 左移。":"，停止扫描。"}`
          });
          if(!ok) break;
          j--;
          add({
            low,high,i,j,pivot,pivotIndex:a.findIndex(x=>x.id===pivotToken.id),pivotToken,
            focus:[j],kind:"move",title:"移动 j",message:`j → ${j}`
          });
        }

        while(i<j){
          metrics.comparisons++;
          const ok=a[i].value<=pivot;
          add({
            low,high,i,j,pivot,pivotIndex:a.findIndex(x=>x.id===pivotToken.id),pivotToken,
            focus:[i],kind:"compare",title:"左侧扫描",
            message:`${a[i].value} ${ok?"≤":">"} ${pivot}${ok?"，i 右移。":"，停止扫描。"}`
          });
          if(!ok) break;
          i++;
          add({
            low,high,i,j,pivot,pivotIndex:a.findIndex(x=>x.id===pivotToken.id),pivotToken,
            focus:[i],kind:"move",title:"移动 i",message:`i → ${i}`
          });
        }

        if(i<j){
          const left=a[i].value,right=a[j].value;
          [a[i],a[j]]=[a[j],a[i]];
          metrics.operations++;
          add({
            low,high,i,j,pivot,pivotIndex:a.findIndex(x=>x.id===pivotToken.id),pivotToken,
            focus:[i,j],kind:"swap",title:"交换",
            message:`交换 ${left} 与 ${right}。`
          });
        }
      }

      if(i!==low){
        const first=a[low].value,meet=a[i].value;
        [a[low],a[i]]=[a[i],a[low]];
        metrics.operations++;
        add({
          low,high,i,j,pivot,pivotIndex:i,pivotToken,
          focus:[low,i],kind:"swap",title:"pivot 归位",
          message:`交换 ${first} 与 ${meet}，pivot ${pivot} 到达下标 ${i}。`
        });
      }

      sorted.add(i);
      add({
        low,high,i,j,pivot,pivotIndex:i,pivotToken,
        focus:[i],kind:"done",title:"划分完成",
        message:`pivot ${pivot} 的最终位置为 ${i}。`
      });

      qs(low,i-1);
      qs(i+1,high);
    }

    qs(0,a.length-1);
    for(let k=0;k<a.length;k++) sorted.add(k);
    s.push(snapshot(a,{
      low:0,high:a.length-1,kind:"done",title:"排序完成",
      message:a.map(x=>x.value).join("  ·  ")
    },sorted,metrics,null));
    return s;
  }

  function generateHole(values){
    const a=makeTokens(values);
    const s=[];
    const sorted=new Set();
    const metrics={comparisons:0,operations:0};

    const add=(data,pivotToken=null)=>{
      s.push(snapshot(a,data,sorted,metrics,pivotToken));
    };

    function qs(low,high){
      if(low>high) return;

      add({
        low,high,i:low,j:high,kind:"range",title:"进入子表",
        message:`处理 A[${low}…${high}]。`
      });

      if(low===high){
        sorted.add(low);
        add({
          low,high,i:low,j:high,pivot:a[low].value,pivotIndex:low,
          kind:"done",title:"位置确定",
          message:`${a[low].value} 已位于最终位置。`
        },a[low]);
        return;
      }

      let i=low,j=high,hole=low;
      const pivotToken=a[low];
      const pivot=pivotToken.value;
      a[low]=null;

      add({
        low,high,i,j,pivot,pivotIndex:null,hole,
        kind:"pivot",title:"取出 pivot",
        message:`保存 ${pivot}，下标 ${low} 留下坑位。`
      },pivotToken);

      while(i<j){
        while(i<j){
          metrics.comparisons++;
          const ok=a[j].value>=pivot;
          add({
            low,high,i,j,pivot,pivotIndex:null,hole,
            focus:[j],kind:"compare",title:"从右扫描",
            message:`${a[j].value} ${ok?"≥":"<"} ${pivot}${ok?"，j 左移。":"，填入坑位。"}`
          },pivotToken);
          if(!ok) break;
          j--;
          add({
            low,high,i,j,pivot,pivotIndex:null,hole,
            focus:[j],kind:"move",title:"移动 j",message:`j → ${j}`
          },pivotToken);
        }

        if(i<j){
          const from=j,oldHole=hole,value=a[j].value;
          a[hole]=a[j];
          a[j]=null;
          hole=j;
          i++;
          metrics.operations++;
          add({
            low,high,i,j,pivot,pivotIndex:null,hole,
            focus:[oldHole,from],kind:"swap",title:"右侧填坑",
            message:`${value} → A[${oldHole}]，新坑位为 ${from}。`
          },pivotToken);
        }

        while(i<j){
          metrics.comparisons++;
          const ok=a[i].value<=pivot;
          add({
            low,high,i,j,pivot,pivotIndex:null,hole,
            focus:[i],kind:"compare",title:"从左扫描",
            message:`${a[i].value} ${ok?"≤":">"} ${pivot}${ok?"，i 右移。":"，填入坑位。"}`
          },pivotToken);
          if(!ok) break;
          i++;
          add({
            low,high,i,j,pivot,pivotIndex:null,hole,
            focus:[i],kind:"move",title:"移动 i",message:`i → ${i}`
          },pivotToken);
        }

        if(i<j){
          const from=i,oldHole=hole,value=a[i].value;
          a[hole]=a[i];
          a[i]=null;
          hole=i;
          j--;
          metrics.operations++;
          add({
            low,high,i,j,pivot,pivotIndex:null,hole,
            focus:[oldHole,from],kind:"swap",title:"左侧填坑",
            message:`${value} → A[${oldHole}]，新坑位为 ${from}。`
          },pivotToken);
        }
      }

      a[hole]=pivotToken;
      metrics.operations++;
      add({
        low,high,i,j,pivot,pivotIndex:hole,hole:null,
        focus:[hole],kind:"pivot",title:"pivot 填坑",
        message:`将 ${pivot} 放回下标 ${hole}。`
      },pivotToken);

      sorted.add(hole);
      add({
        low,high,i,j,pivot,pivotIndex:hole,hole:null,
        focus:[hole],kind:"done",title:"划分完成",
        message:`pivot ${pivot} 的最终位置为 ${hole}。`
      },pivotToken);

      qs(low,hole-1);
      qs(hole+1,high);
    }

    qs(0,a.length-1);
    for(let k=0;k<a.length;k++) sorted.add(k);
    s.push(snapshot(a,{
      low:0,high:a.length-1,kind:"done",title:"排序完成",
      message:a.map(x=>x.value).join("  ·  ")
    },sorted,metrics,null));
    return s;
  }

  function parseInput(){
    const raw=els.input.value.trim();
    const parts=raw.split(/[\s,，;；]+/).filter(Boolean);
    if(parts.length<2 || parts.length>15){
      els.error.textContent="请输入 2～15 个整数。";
      return null;
    }
    const nums=parts.map(Number);
    if(nums.some(v=>!Number.isInteger(v) || Math.abs(v)>999)){
      els.error.textContent="元素需为绝对值不超过 999 的整数。";
      return null;
    }
    els.error.textContent="";
    return nums;
  }

  function setup({animate=true}={}){
    pause();
    cancelVisualAnimation();
    const nums=parseInput();
    if(!nums) return;
    original=[...nums];
    steps=algo==="exchange" ? generateExchange(nums) : generateHole(nums);
    current=0;
    tokenNodes.forEach(node=>node.remove());
    tokenNodes.clear();
    tokenPositions.clear();
    render(true,animate);
  }

  function layoutFor(st){
    const n=st.cells.length;
    const width=Math.max(760,Math.min(1220,90+n*72));
    const height=360;
    els.stage.setAttribute("viewBox",`0 0 ${width} ${height}`);
    els.stage.style.setProperty("--stage-w",`${width}px`);

    const left=54,right=54;
    const usable=width-left-right;
    const gap=Math.min(72,usable/n);
    const barW=Math.min(48,gap*.66);
    const baseY=282;
    const slotY=84;
    const slotH=210;
    const xs=Array.from({length:n},(_,i)=>left+gap*(i+.5));

    const vals=original.length ? original : [0,1];
    const min=Math.min(...vals),max=Math.max(...vals);
    const span=Math.max(1,max-min);
    const h=v=>58+((v-min)/span)*112;

    return {width,height,left,right,gap,barW,baseY,slotY,slotH,xs,h};
  }

  function drawStatic(st,L){
    els.grid.innerHTML="";
    els.range.innerHTML="";
    els.slots.innerHTML="";
    els.pointers.innerHTML="";

    for(let y=120;y<=L.baseY;y+=40){
      els.grid.appendChild(svg("line",{x1:L.left-20,y1:y,x2:L.width-L.right+20,y2:y,class:"grid-line"}));
    }
    els.grid.appendChild(svg("line",{x1:L.left-20,y1:L.baseY+.5,x2:L.width-L.right+20,y2:L.baseY+.5,class:"baseline"}));

    if(st.low!=null && st.high!=null){
      const x1=L.xs[st.low]-L.gap*.34;
      const x2=L.xs[st.high]+L.gap*.34;
      const y=66;
      els.range.appendChild(svg("line",{x1,y1:y,x2,y2:y,class:"range-line"}));
      els.range.appendChild(svg("circle",{cx:x1,cy:y,r:2.8,class:"range-cap"}));
      els.range.appendChild(svg("circle",{cx:x2,cy:y,r:2.8,class:"range-cap"}));
      const label=svg("text",{x:(x1+x2)/2,y:y-11,class:"range-label","text-anchor":"middle"});
      label.textContent=`A[${st.low}…${st.high}]`;
      els.range.appendChild(label);
    }

    st.cells.forEach((cell,index)=>{
      const inRange=st.low!=null && index>=st.low && index<=st.high;
      const classes=["slot"];
      if(inRange) classes.push("in-range");
      if(st.sorted.includes(index)) classes.push("sorted");
      if(index===st.hole) classes.push("hole");
      if(st.focus.includes(index)) classes.push(st.kind==="swap"?"swap":"focus");

      const r=svg("rect",{
        x:L.xs[index]-L.gap*.37,
        y:L.slotY,
        width:L.gap*.74,
        height:L.slotH,
        rx:12,
        class:classes.join(" ")
      });
      els.slots.appendChild(r);

      const idx=svg("text",{x:L.xs[index],y:317,class:"index-label"});
      idx.textContent=index;
      els.slots.appendChild(idx);

      if(index===st.hole){
        const hc=svg("text",{x:L.xs[index],y:105,class:"hole-caption"});
        hc.textContent="HOLE";
        els.slots.appendChild(hc);
      }
    });

    function pointer(index,text,cls){
      if(index==null || index<0 || index>=L.xs.length) return;
      const g=svg("g",{class:`ptr-badge ${cls}`,transform:`translate(${L.xs[index]} 337)`});
      g.appendChild(svg("circle",{cx:0,cy:0,r:12}));
      const t=svg("text",{x:0,y:.5});
      t.textContent=text;
      g.appendChild(t);
      els.pointers.appendChild(g);
    }

    if(st.i!=null && st.j!=null && st.i===st.j) pointer(st.i,"i·j","both");
    else{
      pointer(st.i,"i","i");
      pointer(st.j,"j","j");
    }
  }

  function ensureTokenNode(token,L){
    let g=tokenNodes.get(token.id);
    if(g) return g;

    g=svg("g",{class:"token"});
    const bar=svg("rect",{class:"value-bar",rx:10});
    const text=svg("text",{class:"value-label"});
    g.append(bar,text);
    els.tokens.appendChild(g);
    tokenNodes.set(token.id,g);

    g.style.opacity="0";
    g.dataset.value=token.value;
    return g;
  }

  function targetMap(st,L){
    const map=new Map();

    st.cells.forEach((token,index)=>{
      if(!token) return;
      map.set(token.id,{
        x:L.xs[index],
        y:L.baseY,
        index,
        held:false,
        token
      });
    });

    if(st.pivotToken && !map.has(st.pivotToken.id)){
      const anchor=st.hole!=null ? st.hole : (st.i!=null ? st.i : st.low || 0);
      map.set(st.pivotToken.id,{
        x:L.xs[Math.max(0,Math.min(L.xs.length-1,anchor))],
        y:158,
        index:null,
        held:true,
        token:st.pivotToken
      });
    }
    return map;
  }

  function tokenClass(st,target){
    const classes=["token"];
    if(target.held) classes.push("held","pivot");
    if(target.index!=null){
      if(st.sorted.includes(target.index)) classes.push("sorted");
      if(target.index===st.pivotIndex) classes.push("pivot");
      if(st.focus.includes(target.index)) classes.push(st.kind==="swap"?"swap":"focus");
    }
    return classes.join(" ");
  }

  function configureTokenNode(node,target,st,L){
    const value=target.token.value;
    const bar=node.querySelector(".value-bar");
    const label=node.querySelector(".value-label");
    const h=L.h(value);
    const w=target.held ? Math.min(44,L.barW) : L.barW;
    const useH=target.held ? Math.min(72,h*.58) : h;

    bar.setAttribute("x",(-w/2).toFixed(2));
    bar.setAttribute("y",(-useH).toFixed(2));
    bar.setAttribute("width",w.toFixed(2));
    bar.setAttribute("height",useH.toFixed(2));

    label.setAttribute("x","0");
    label.setAttribute("y",(-useH+19).toFixed(2));
    label.textContent=String(value);

    node.setAttribute("class",tokenClass(st,target));
    node.dataset.value=value;
  }

  function cancelVisualAnimation(){
    renderSerial++;
    if(animationFrame) cancelAnimationFrame(animationFrame);
    animationFrame=null;
    animating=false;
  }

  function easeOutCubic(t){return 1-Math.pow(1-t,3)}

  function renderTokens(st,L,{animate=true,initial=false}={}){
    cancelVisualAnimation();
    const serial=renderSerial;
    const targets=targetMap(st,L);
    const startPositions=new Map();

    for(const [id,target] of targets){
      const node=ensureTokenNode(target.token,L);
      configureTokenNode(node,target,st,L);

      const prev=tokenPositions.get(id);
      if(prev){
        startPositions.set(id,{x:prev.x,y:prev.y,opacity:1});
      }else{
        startPositions.set(id,{x:target.x,y:target.y+16,opacity:0});
      }
      node.style.display="";
    }

    for(const [id,node] of tokenNodes){
      if(!targets.has(id)) node.style.display="none";
    }

    const duration=(reducedMotion || !animate) ? 1 : motionMs[els.speed.value];
    const t0=performance.now();
    animating=duration>1;
    updateControls();

    function frame(now){
      if(serial!==renderSerial) return;
      const p=Math.min(1,(now-t0)/duration);
      const q=easeOutCubic(p);

      for(const [id,target] of targets){
        const node=tokenNodes.get(id);
        const start=startPositions.get(id);
        const x=start.x+(target.x-start.x)*q;
        let y=start.y+(target.y-start.y)*q;

        // Swap / fill operations get a small vertical arc for clearer spatial motion.
        if(st.kind==="swap" && start.x!==target.x){
          const arc=Math.sin(Math.PI*p)*(-18);
          y+=arc;
        }

        node.setAttribute("transform",`translate(${x.toFixed(2)} ${y.toFixed(2)})`);
        node.style.opacity=String(start.opacity+(1-start.opacity)*q);
      }

      if(p<1){
        animationFrame=requestAnimationFrame(frame);
      }else{
        animationFrame=null;
        animating=false;
        for(const [id,target] of targets){
          tokenPositions.set(id,{x:target.x,y:target.y});
          const node=tokenNodes.get(id);
          node.style.opacity="1";
        }
        updateControls();
      }
    }
    animationFrame=requestAnimationFrame(frame);

    // Remove stale visual-position entries, but keep nodes reusable for reverse navigation.
    for(const id of [...tokenPositions.keys()]){
      if(!targets.has(id)) tokenPositions.delete(id);
    }
  }

  function render(initial=false,animate=true){
    if(!steps.length) return;
    const st=steps[current];
    const L=layoutFor(st);

    drawStatic(st,L);
    renderTokens(st,L,{animate,initial});

    els.eyebrow.textContent=`STEP ${current+1}`;
    els.title.textContent=st.title || "—";
    els.message.textContent=st.message || "";
    els.stepCount.textContent=`${current+1} / ${steps.length}`;
    els.rangeMetric.textContent=st.low==null ? "—" : `${st.low}…${st.high}`;
    els.pivotMetric.textContent=st.pivot==null ? "—" : st.pivot;
    els.compareMetric.textContent=st.comparisons;
    els.opMetric.textContent=st.operations;
    els.opLabel.textContent=algo==="exchange" ? "交换" : "写入";
    els.progress.style.width=`${((current+1)/steps.length)*100}%`;

    updateControls();

    if(initial && !reducedMotion){
      [...tokenNodes.values()].forEach((node,index)=>{
        node.animate(
          [{opacity:0,transform:`${node.getAttribute("transform")} translate(0 14px)`},{opacity:1,transform:node.getAttribute("transform")}],
          {duration:480,delay:index*34,easing:"cubic-bezier(.22,.8,.22,1)",fill:"both"}
        );
      });
    }
  }

  function updateControls(){
    els.prev.disabled=current<=0 || animating;
    els.next.disabled=current>=steps.length-1 || animating;
    els.reset.disabled=current===0 && !playing;
    els.apply.disabled=animating;
    els.random.disabled=animating;

    els.play.setAttribute("aria-label",playing ? "暂停" : "播放");
    els.play.title=playing ? "暂停（Space）" : "播放（Space）";
    els.playIcon.innerHTML = playing
      ? '<path d="M7.7 6.5h3v11h-3zm5.6 0h3v11h-3z" fill="currentColor"/>'
      : '<path d="M8.4 6.7c0-1 1.1-1.6 1.9-1l7.9 5.1c.8.5.8 1.7 0 2.2l-7.9 5.2c-.8.5-1.9-.1-1.9-1V6.7Z" fill="currentColor"/>';
  }

  function gotoStep(nextIndex,{fromPlay=false}={}){
    if(animating) return false;
    const target=Math.max(0,Math.min(steps.length-1,nextIndex));
    if(target===current) return false;
    if(!fromPlay) pause();
    current=target;
    render(false,true);
    return true;
  }

  function next(){return gotoStep(current+1)}
  function prev(){return gotoStep(current-1)}

  function reset(){
    pause();
    cancelVisualAnimation();
    current=0;
    tokenPositions.clear();
    render(false,true);
  }

  function schedulePlay(){
    clearTimeout(playTimer);
    if(!playing) return;
    playTimer=setTimeout(()=>{
      if(!playing) return;
      if(animating){
        schedulePlay();
        return;
      }
      if(current>=steps.length-1){
        pause();
        return;
      }
      current++;
      render(false,true);
      schedulePlay();
    },speedMs[els.speed.value]);
  }

  function play(){
    if(playing){
      pause();
      return;
    }
    if(current>=steps.length-1){
      cancelVisualAnimation();
      current=0;
      tokenPositions.clear();
      render(false,true);
    }
    playing=true;
    updateControls();
    schedulePlay();
  }

  function pause(){
    playing=false;
    clearTimeout(playTimer);
    playTimer=null;
    updateControls();
  }

  function randomize(){
    pause();
    const length=7+Math.floor(Math.random()*4);
    const arr=Array.from({length},()=>10+Math.floor(Math.random()*90));
    els.input.value=arr.join(", ");
    setup({animate:true});
  }

  function setAlgo(nextAlgo){
    if(nextAlgo===algo) return;
    algo=nextAlgo;
    document.querySelectorAll("[data-algo]").forEach(btn=>{
      btn.setAttribute("aria-selected",String(btn.dataset.algo===algo));
    });
    els.subtitle.textContent=algo==="exchange"
      ? "交换式划分 · 双指针寻找错位元素并交换"
      : "挖坑式划分 · 保存 pivot 后交替搬移填坑";
    tokenPositions.clear();
    setup({animate:true});
  }

  document.querySelectorAll("[data-algo]").forEach(btn=>{
    btn.addEventListener("click",()=>setAlgo(btn.dataset.algo));
  });

  els.apply.addEventListener("click",()=>setup({animate:true}));
  els.random.addEventListener("click",randomize);
  els.prev.addEventListener("click",prev);
  els.next.addEventListener("click",next);
  els.play.addEventListener("click",play);
  els.reset.addEventListener("click",reset);

  els.speed.addEventListener("input",()=>{
    if(playing) schedulePlay();
  });

  els.input.addEventListener("keydown",event=>{
    if(event.key==="Enter"){
      event.preventDefault();
      setup({animate:true});
    }
  });

  document.addEventListener("keydown",event=>{
    if(event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey) return;
    const target=event.target;
    const tag=target && target.tagName ? target.tagName.toLowerCase() : "";
    if(tag==="input" || tag==="textarea" || tag==="select" || target?.isContentEditable) return;

    if(event.code==="Space"){
      event.preventDefault();
      play();
    }else if(event.code==="ArrowLeft"){
      event.preventDefault();
      prev();
    }else if(event.code==="ArrowRight"){
      event.preventDefault();
      next();
    }else if(event.code==="KeyR"){
      event.preventDefault();
      reset();
    }
  });

  setup({animate:true});
})();
</script>
