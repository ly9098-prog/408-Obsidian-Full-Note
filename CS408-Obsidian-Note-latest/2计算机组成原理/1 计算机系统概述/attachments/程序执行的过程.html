<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>408 计组｜程序执行过程</title>
<style>
:root{
  --bg:#f5f7fb;--card:rgba(255,255,255,.68);--card2:rgba(255,255,255,.84);
  --text:#111827;--muted:#6b7280;--hair:rgba(17,24,39,.10);--wire:#aeb8c7;
  --blue:#0a84ff;--blue2:#5ac8fa;--green:#30c768;--orange:#ff9f0a;
  --shadow:0 28px 70px rgba(42,51,73,.12);--ease:cubic-bezier(.22,.78,.2,1)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#080b11;--card:rgba(20,24,32,.66);--card2:rgba(26,31,41,.86);
  --text:#f5f7fb;--muted:#9aa5b5;--hair:rgba(255,255,255,.09);--wire:#475263;
  --shadow:0 30px 80px rgba(0,0,0,.36)
}}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:
  radial-gradient(900px 520px at 12% -8%,rgba(10,132,255,.16),transparent 60%),
  radial-gradient(720px 420px at 95% 8%,rgba(90,200,250,.11),transparent 60%),var(--bg)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.018),rgba(255,255,255,0));mask-image:linear-gradient(#000,transparent 70%)}
button,select{font:inherit;color:inherit}.app{width:min(1260px,calc(100% - 28px));margin:auto;padding:22px 0 28px}
.glass{background:var(--card);border:1px solid var(--hair);backdrop-filter:blur(26px) saturate(155%);-webkit-backdrop-filter:blur(26px) saturate(155%);box-shadow:var(--shadow)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:2px 3px 16px;opacity:0;transform:translateY(8px);animation:enter .55s var(--ease) forwards}
.titlewrap{display:flex;align-items:baseline;gap:12px}.title{font-size:clamp(23px,2.2vw,32px);font-weight:780;letter-spacing:-.035em}.kicker{font-size:12px;color:var(--muted);font-weight:650}
.instruction{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--hair);border-radius:999px;background:rgba(127,127,127,.055);font:700 12px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}.instruction span{color:var(--muted);font-family:inherit;font-weight:600}

.stage{border-radius:28px;overflow:hidden;opacity:0;transform:translateY(14px) scale(.993);animation:enter .65s var(--ease) .07s forwards}
.stagehead{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:14px 17px 10px}.phase{display:flex;align-items:center;gap:10px;min-width:0}.phaseIndex{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--blue);color:white;font-size:11px;font-weight:800;box-shadow:0 8px 18px rgba(10,132,255,.22)}.phaseText{font-size:13px;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.microTop{font:680 11.5px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);white-space:nowrap}
.sceneWrap{position:relative;padding:0 10px}.sceneWrap:after{content:"";position:absolute;left:6%;right:6%;top:1px;height:1px;background:linear-gradient(90deg,transparent,rgba(90,200,250,.75),transparent);opacity:0;box-shadow:0 0 18px rgba(90,200,250,.35);animation:sweep 1.1s var(--ease) .35s 1}
svg{display:block;width:100%;height:auto;aspect-ratio:1180/560;border-radius:21px;overflow:hidden}

.info{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;padding:8px 18px 14px}.copy h2{margin:0;font-size:17px;letter-spacing:-.018em}.copy p{margin:5px 0 0;color:var(--muted);font-size:12.5px;line-height:1.5}.microBox{min-width:210px;padding:9px 11px;border:1px solid var(--hair);border-radius:13px;background:rgba(127,127,127,.045)}.microLabel{font-size:9.5px;font-weight:760;color:var(--muted);letter-spacing:.05em;margin-bottom:4px}.microBox code{display:block;white-space:pre-line;font:700 11.5px/1.48 ui-monospace,SFMono-Regular,Menlo,monospace}

.timeline{border-top:1px solid var(--hair);padding:10px 13px 11px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.step{border:0;background:transparent;border-radius:12px;padding:8px 8px 7px;cursor:pointer;text-align:left;transition:.22s var(--ease)}.step:hover{background:rgba(127,127,127,.055)}.step.active{background:rgba(10,132,255,.10)}.stepTop{display:flex;align-items:center;gap:7px}.stepDot{width:7px;height:7px;border-radius:50%;background:rgba(127,127,127,.25);box-shadow:0 0 0 0 rgba(10,132,255,0);transition:.22s var(--ease)}.step.active .stepDot{background:var(--blue);box-shadow:0 0 0 5px rgba(10,132,255,.10)}.step strong{font-size:11.5px;font-weight:720}.step small{display:block;color:var(--muted);font-size:9.5px;margin:4px 0 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.controls{margin-top:12px;border-radius:18px;padding:9px 10px;display:grid;grid-template-columns:auto minmax(140px,1fr) auto;gap:12px;align-items:center;opacity:0;transform:translateY(8px);animation:enter .55s var(--ease) .18s forwards}.buttons{display:flex;gap:7px}.btn{height:38px;padding:0 12px;border:1px solid var(--hair);border-radius:11px;background:var(--card2);box-shadow:0 7px 16px rgba(35,43,60,.06);font-size:12px;font-weight:700;cursor:pointer;transition:.18s var(--ease)}.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:active:not(:disabled){transform:scale(.98)}.btn:disabled{opacity:.34;cursor:not-allowed}.btn.primary{border-color:transparent;background:var(--blue);color:white;box-shadow:0 9px 20px rgba(10,132,255,.22)}.btn.icon{width:38px;padding:0}.progress{height:5px;border-radius:999px;background:rgba(127,127,127,.12);overflow:hidden}.fill{height:100%;width:16.666%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--blue2));transition:width .35s var(--ease)}.meta{display:flex;align-items:center;gap:8px}.count{min-width:30px;text-align:right;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.meta select{height:34px;padding:0 24px 0 9px;border:1px solid var(--hair);border-radius:10px;background:var(--card2);font-size:11px}.btn:focus-visible,.step:focus-visible,select:focus-visible{outline:3px solid rgba(10,132,255,.22);outline-offset:2px}

/* SVG */
.bg{fill:rgba(127,127,127,.018)}.plate{fill:rgba(255,255,255,.48);stroke:rgba(100,116,139,.15);stroke-width:1.1}@media(prefers-color-scheme:dark){.plate{fill:rgba(14,18,25,.57);stroke:rgba(255,255,255,.08)}}
.module{fill:rgba(127,127,127,.038);stroke:rgba(100,116,139,.17);stroke-width:1.05;transition:fill .3s var(--ease),stroke .3s var(--ease),filter .3s var(--ease),transform .3s var(--ease);transform-box:fill-box;transform-origin:center}.module.active{fill:rgba(10,132,255,.09);stroke:rgba(10,132,255,.56);filter:url(#blueGlow);transform:translateY(-1px)}.module.done{fill:rgba(48,199,104,.09);stroke:rgba(48,199,104,.50);filter:url(#greenGlow)}
.cell{fill:rgba(127,127,127,.032);stroke:rgba(100,116,139,.13);stroke-width:1;transition:.28s var(--ease)}.cell.active{fill:rgba(10,132,255,.085);stroke:rgba(10,132,255,.43)}
.wire{fill:none;stroke:var(--wire);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.64;transition:.25s var(--ease)}.wire.active{stroke:var(--blue);opacity:1;filter:url(#blueGlow)}.wire.ctrl{stroke-dasharray:6 7}
.t1{fill:var(--text);font-size:15px;font-weight:760}.t2{fill:var(--muted);font-size:10.5px;font-weight:650}.mono{fill:var(--text);font:760 12.5px ui-monospace,SFMono-Regular,Menlo,monospace}.hint{fill:var(--muted);font-size:9px;font-weight:610}.label{fill:var(--muted);font-size:8.5px;font-weight:730;letter-spacing:.05em}
.alu{fill:rgba(127,127,127,.038);stroke:rgba(100,116,139,.18);stroke-width:1.1;transition:.28s var(--ease)}.alu.active{fill:rgba(255,159,10,.11);stroke:rgba(255,159,10,.58);filter:url(#orangeGlow)}
#token{opacity:0;filter:url(#tokenGlow)}#token rect{fill:var(--blue)}#token text{fill:#fff;font:800 9.5px ui-monospace,SFMono-Regular,Menlo,monospace}.flash{animation:flash .5s var(--ease)}#pulse{fill:none;stroke:var(--orange);stroke-width:1.7;opacity:0;transform-box:fill-box;transform-origin:center}.cursor{fill:var(--blue);opacity:.95;transition:transform .35s var(--ease)}
#cpu,#memory{opacity:0;transform:translateY(8px);animation:sceneIn .55s var(--ease) .26s forwards}#cpu{animation-delay:.34s}
@keyframes enter{to{opacity:1;transform:none}}@keyframes sceneIn{to{opacity:1;transform:none}}@keyframes sweep{0%{opacity:0;transform:translateY(0)}20%{opacity:.8}80%{opacity:.45}100%{opacity:0;transform:translateY(430px)}}@keyframes flash{0%{opacity:.42;transform:scale(.97)}100%{opacity:1;transform:scale(1)}}
@media(max-width:860px){.timeline{grid-template-columns:repeat(3,1fr)}.info{grid-template-columns:1fr}.microBox{min-width:0}.controls{grid-template-columns:1fr}.buttons,.meta{justify-content:center}}
@media(max-width:620px){.app{width:calc(100% - 14px);padding-top:12px}.topbar{align-items:flex-start;flex-direction:column}.instruction{font-size:11px}.stagehead{grid-template-columns:1fr}.microTop{display:none}.timeline{grid-template-columns:1fr 1fr}.step small{display:none}.sceneWrap{overflow:auto}.sceneWrap svg{min-width:760px}.copy p{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="titlewrap"><div class="title">程序执行过程</div><div class="kicker">408 · 抽象数据通路</div></div>
    <div class="instruction">ADD R1, R2 <span>R1 ← R1 + R2</span></div>
  </header>

  <section class="stage glass" aria-label="程序执行二维动画">
    <div class="stagehead">
      <div class="phase"><div class="phaseIndex" id="phaseIndex">01</div><div class="phaseText" id="phaseText">PC 送地址</div></div>
      <div class="microTop" id="microTop">PC → MAR</div>
    </div>

    <div class="sceneWrap">
      <svg id="scene" viewBox="0 0 1180 560" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">408 计组：程序执行过程</title>
        <desc id="svgDesc">以 ADD R1,R2 为例，用简化数据通路演示取指、译码取数、执行与写回。</desc>
        <defs>
          <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feFlood flood-color="#0a84ff" flood-opacity=".28"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feFlood flood-color="#30c768" flood-opacity=".26"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="orangeGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feFlood flood-color="#ff9f0a" flood-opacity=".30"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="tokenGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#0a84ff" flood-opacity=".38"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <rect class="bg" width="1180" height="560" rx="22"/>

        <!-- Main memory -->
        <g id="memory">
          <rect class="plate" x="48" y="72" width="248" height="390" rx="22"/>
          <text class="t1" x="72" y="103">主存</text><text class="label" x="112" y="103">MEMORY</text>
          <g id="m0040"><rect class="cell" x="72" y="146" width="200" height="58" rx="13"/><text class="hint" x="86" y="167">0040</text><text class="mono" x="86" y="190">ADD R1, R2</text></g>
          <g id="m0041"><rect class="cell" x="72" y="212" width="200" height="58" rx="13"/><text class="hint" x="86" y="233">0041</text><text class="mono" x="86" y="256">SUB R3, R1</text></g>
          <g><rect class="cell" x="72" y="278" width="200" height="58" rx="13"/><text class="hint" x="86" y="299">0042</text><text class="mono" x="86" y="322">…</text></g>
          <path id="memCursor" class="cursor" d="M58 168 L68 175 L58 182 Z"/>
        </g>

        <!-- CPU -->
        <g id="cpu">
          <rect class="plate" x="348" y="44" width="784" height="442" rx="26"/>
          <text class="t1" x="375" y="78">CPU</text>

          <g id="pcModule"><rect class="module" x="385" y="108" width="130" height="68" rx="15"/><text class="t2" x="401" y="133">PC</text><text class="hint" x="401" y="150">程序计数器</text><text id="pc" class="mono" x="401" y="168">0040</text></g>
          <g id="marModule"><rect class="module" x="542" y="108" width="138" height="68" rx="15"/><text class="t2" x="558" y="133">MAR</text><text class="hint" x="558" y="150">地址寄存器</text><text id="mar" class="mono" x="558" y="168">—</text></g>
          <g id="mdrModule"><rect class="module" x="706" y="108" width="152" height="68" rx="15"/><text class="t2" x="722" y="133">MDR</text><text class="hint" x="722" y="150">数据寄存器</text><text id="mdr" class="mono" x="722" y="168">—</text></g>
          <g id="irModule"><rect class="module" x="884" y="108" width="200" height="68" rx="15"/><text class="t2" x="900" y="133">IR</text><text class="hint" x="900" y="150">指令寄存器</text><text id="ir" class="mono" x="900" y="168">—</text></g>

          <g id="regModule"><rect class="module" x="385" y="230" width="232" height="194" rx="18"/><text class="t1" x="405" y="260">寄存器组</text>
            <g id="r1row"><rect class="cell" x="405" y="287" width="192" height="42" rx="10"/><text class="t2" x="421" y="313">R1</text><text id="r1" class="mono" x="574" y="313" text-anchor="end">7</text></g>
            <g id="r2row"><rect class="cell" x="405" y="337" width="192" height="42" rx="10"/><text class="t2" x="421" y="363">R2</text><text id="r2" class="mono" x="574" y="363" text-anchor="end">5</text></g>
            <g><rect class="cell" x="405" y="387" width="192" height="24" rx="9"/><text class="hint" x="421" y="403">R3 = 20</text></g>
          </g>

          <g id="aluModule"><path class="alu" d="M674 276 L772 294 L751 340 L772 386 L674 404 L637 340 Z"/><text class="t1" x="690" y="329">ALU</text><text id="aluIn" class="mono" x="688" y="355">—</text></g>

          <g id="cuModule"><rect class="module" x="818" y="230" width="266" height="118" rx="18"/><text class="t1" x="838" y="260">控制器</text><text class="label" x="896" y="260">DECODE</text><text id="op" class="mono" x="838" y="296">OP: —</text><text id="fields" class="mono" x="838" y="324">Dst/Src: —</text></g>
          <g id="outModule"><rect class="module" x="818" y="372" width="266" height="52" rx="15"/><text class="t2" x="838" y="394">ALUout</text><text id="out" class="mono" x="838" y="414">—</text></g>
        </g>

        <!-- Data/control paths -->
        <path id="pPcMar" class="wire" d="M515 142 C524 142 533 142 542 142"/>
        <path id="pMarMem" class="wire" d="M542 142 C465 142 352 149 296 175"/>
        <path id="pMemMdr" class="wire" d="M296 175 C410 215 594 204 706 142"/>
        <path id="pMdrIr" class="wire" d="M858 142 C866 142 876 142 884 142"/>
        <path id="pIrCu" class="wire" d="M986 176 C986 196 978 216 964 230"/>
        <path id="pCuReg" class="wire ctrl" d="M818 306 C748 306 688 292 617 292"/>
        <path id="pR1Alu" class="wire" d="M597 308 C618 308 631 319 648 330"/>
        <path id="pR2Alu" class="wire" d="M597 358 C620 358 631 351 645 342"/>
        <path id="pAluR1" class="wire" d="M676 390 C641 428 620 418 597 310"/>

        <g id="token"><rect x="-31" y="-13" width="62" height="26" rx="9"/><text id="tokenText" text-anchor="middle" dominant-baseline="central" y="1">0040</text></g>
        <circle id="pulse" cx="704" cy="340" r="44"/>
      </svg>
    </div>

    <div class="info" aria-live="polite">
      <div class="copy"><h2 id="stepTitle">PC 送地址</h2><p id="stepDesc">PC 保存待取指令地址 0040；本步将该地址送入 MAR。</p></div>
      <div class="microBox"><div class="microLabel">本步微操作</div><code id="micro">PC → MAR</code></div>
    </div>

    <nav id="timeline" class="timeline" aria-label="演示步骤"></nav>
  </section>

  <section class="controls glass" aria-label="动画控制">
    <div class="buttons">
      <button class="btn" id="prev" title="上一步（←）">← 上一步</button>
      <button class="btn primary" id="play" title="播放 / 暂停（Space）" aria-pressed="false">▶ 播放</button>
      <button class="btn" id="next" title="下一步（→）">下一步 →</button>
      <button class="btn icon" id="reset" title="重置（Home）" aria-label="重置">↺</button>
    </div>
    <div class="progress" aria-label="演示进度"><div class="fill" id="fill"></div></div>
    <div class="meta"><span class="count" id="count">1 / 6</span><select id="speed" aria-label="动画速度"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></div>
  </section>
</main>
<script>
(()=>{
  const $=id=>document.getElementById(id);
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const instruction='ADD R1,R2';
  const steps=[
    {title:'PC 送地址',short:'PC → MAR',desc:'PC 保存待取指令地址 0040；本步将该地址送入 MAR。',micro:'PC → MAR',mods:['pcModule','marModule'],wires:['pPcMar']},
    {title:'主存读指令',short:'M[MAR] → MDR',desc:'MAR=0040 选中主存单元，读出的指令字先进入 MDR。',micro:'M[MAR] → MDR',mods:['marModule','mdrModule'],wires:['pMarMem','pMemMdr']},
    {title:'装入 IR',short:'MDR → IR；PC ← PC + Δ',desc:'指令进入 IR，同时形成顺序执行地址。本例按字编址且每条指令占 1 个存储字，所以 Δ=1，PC 由 0040 变为 0041。',micro:'MDR → IR\nPC ← PC + Δ  （本例 Δ=1）',mods:['mdrModule','irModule','pcModule'],wires:['pMdrIr']},
    {title:'译码并取数',short:'IR → 控制器；R1/R2 → ALU',desc:'控制器解释操作码与寄存器字段，读取 R1=7、R2=5 作为 ALU 输入。',micro:'OP(IR) → 控制器\nR1 → ALU.A\nR2 → ALU.B',mods:['irModule','cuModule','regModule','aluModule'],wires:['pIrCu','pCuReg','pR1Alu','pR2Alu']},
    {title:'执行',short:'7 + 5 → ALUout',desc:'ALU 完成加法，结果 12 进入结果暂存位置。',micro:'ALUout ← 7 + 5',mods:['aluModule','outModule'],wires:[]},
    {title:'写回',short:'ALUout → R1',desc:'结果写回目的寄存器 R1，R1 由 7 更新为 12；PC 已指向 0041，下一次取指从那里开始。',micro:'R1 ← ALUout\nR1 = 12',mods:['aluModule','regModule','outModule'],wires:['pAluR1']}
  ];
  const modIds=['pcModule','marModule','mdrModule','irModule','cuModule','regModule','aluModule','outModule'];
  const wireIds=['pPcMar','pMarMem','pMemMdr','pMdrIr','pIrCu','pCuReg','pR1Alu','pR2Alu','pAluR1'];
  let current=0,playing=false,serial=0,loopId=0;

  function buildTimeline(){
    $('timeline').innerHTML='';
    steps.forEach((s,i)=>{
      const b=document.createElement('button');b.className='step';b.type='button';b.innerHTML=`<span class="stepTop"><span class="stepDot"></span><strong>${String(i+1).padStart(2,'0')} ${s.title}</strong></span><small>${s.short}</small>`;
      b.onclick=()=>goto(i,true);$('timeline').appendChild(b);
    });
  }
  function clearHighlights(){
    modIds.forEach(id=>$(id)?.querySelector('.module,.alu')?.classList.remove('active','done'));
    wireIds.forEach(id=>$(id)?.classList.remove('active'));
    $('m0040').querySelector('.cell').classList.remove('active');$('m0041').querySelector('.cell').classList.remove('active');
  }
  function highlight(i){
    const s=steps[i];s.mods.forEach(id=>$(id)?.querySelector('.module,.alu')?.classList.add('active'));s.wires.forEach(id=>$(id)?.classList.add('active'));
    if(i===5){$('regModule').querySelector('.module').classList.add('done');$('outModule').querySelector('.module').classList.add('done')}
  }
  function flash(id){const el=$(id);if(!el)return;el.classList.remove('flash');void el.getBBox();el.classList.add('flash')}
  function applyState(i){
    $('pc').textContent=i>=2?'0041':'0040';$('mar').textContent=i>=0?'0040':'—';$('mdr').textContent=i>=1?instruction:'—';$('ir').textContent=i>=2?instruction:'—';
    $('op').textContent=i>=3?'OP: ADD':'OP: —';$('fields').textContent=i>=3?'Dst/Src: R1 / R2':'Dst/Src: —';$('aluIn').textContent=i>=3?'7 , 5':'—';$('out').textContent=i>=4?'12':'—';$('r1').textContent=i>=5?'12':'7';
    $('memCursor').setAttribute('transform',i>=5?'translate(0 66)':'translate(0 0)');$('m0040').querySelector('.cell').classList.toggle('active',i<5);$('m0041').querySelector('.cell').classList.toggle('active',i>=5);
  }
  function updateUI(){
    const s=steps[current];$('phaseIndex').textContent=String(current+1).padStart(2,'0');$('phaseText').textContent=s.title;$('microTop').textContent=s.short;$('stepTitle').textContent=s.title;$('stepDesc').textContent=s.desc;$('micro').textContent=s.micro;
    $('count').textContent=`${current+1} / ${steps.length}`;$('fill').style.width=`${(current+1)/steps.length*100}%`;$('prev').disabled=current===0;$('next').disabled=current===steps.length-1;
    [...$('timeline').children].forEach((el,i)=>el.classList.toggle('active',i===current));$('play').textContent=playing?'❚❚ 暂停':'▶ 播放';$('play').setAttribute('aria-pressed',String(playing));
  }
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  function move(pathId,label,duration,mySerial){
    return new Promise(resolve=>{const path=$(pathId);if(!path||mySerial!==serial)return resolve();const len=path.getTotalLength(),start=performance.now(),d=reduced?1:duration/Number($('speed').value||1);$('tokenText').textContent=label;$('token').style.opacity=1;
      function frame(now){if(mySerial!==serial){$('token').style.opacity=0;return resolve()}const p=Math.min(1,(now-start)/d),pt=path.getPointAtLength(len*ease(p));$('token').setAttribute('transform',`translate(${pt.x} ${pt.y})`);if(p<1)requestAnimationFrame(frame);else{$('token').style.opacity=0;resolve()}}requestAnimationFrame(frame);
    });
  }
  const wait=ms=>new Promise(r=>setTimeout(r,reduced?1:ms/Number($('speed').value||1)));
  async function animateStep(i){
    const mySerial=++serial;clearHighlights();highlight(i);applyState(i-1);
    if(i===0){await move('pPcMar','0040',580,mySerial);if(mySerial!==serial)return;$('mar').textContent='0040';flash('mar')}
    if(i===1){await move('pMarMem','0040',630,mySerial);if(mySerial!==serial)return;await move('pMemMdr','ADD',700,mySerial);if(mySerial!==serial)return;$('mdr').textContent=instruction;flash('mdr')}
    if(i===2){await move('pMdrIr','ADD',540,mySerial);if(mySerial!==serial)return;$('ir').textContent=instruction;flash('ir');await wait(160);if(mySerial!==serial)return;$('pc').textContent='0041';flash('pc')}
    if(i===3){await move('pIrCu','字段',560,mySerial);if(mySerial!==serial)return;$('op').textContent='OP: ADD';$('fields').textContent='Dst/Src: R1 / R2';flash('op');flash('fields');await move('pCuReg','读',430,mySerial);if(mySerial!==serial)return;await move('pR1Alu','7',470,mySerial);if(mySerial!==serial)return;await move('pR2Alu','5',470,mySerial);if(mySerial!==serial)return;$('aluIn').textContent='7 , 5';flash('aluIn')}
    if(i===4){$('aluIn').textContent='7 , 5';$('pulse').style.opacity=1;$('pulse').animate([{transform:'scale(.72)',opacity:.78},{transform:'scale(1.5)',opacity:0}],{duration:reduced?1:760/Number($('speed').value||1),easing:'cubic-bezier(.22,.78,.2,1)'});await wait(350);if(mySerial!==serial)return;$('out').textContent='12';flash('out')}
    if(i===5){$('out').textContent='12';await move('pAluR1','12',700,mySerial);if(mySerial!==serial)return;$('r1').textContent='12';flash('r1');$('memCursor').setAttribute('transform','translate(0 66)');$('m0040').querySelector('.cell').classList.remove('active');$('m0041').querySelector('.cell').classList.add('active')}
    applyState(i);
  }
  function stop(update=true){playing=false;loopId++;serial++;$('token').style.opacity=0;if(update)updateUI()}
  function goto(i,animate=true){stop(false);current=Math.max(0,Math.min(steps.length-1,i));updateUI();clearHighlights();highlight(current);applyState(current);if(animate)animateStep(current)}
  function next(){if(current<steps.length-1)goto(current+1,true)}function prev(){if(current>0)goto(current-1,true)}
  async function playLoop(){if(playing)return;if(current===steps.length-1)current=0;playing=true;updateUI();const myLoop=++loopId;while(playing&&myLoop===loopId){updateUI();await animateStep(current);if(!playing||myLoop!==loopId)return;await wait(560);if(!playing||myLoop!==loopId)return;if(current===steps.length-1){playing=false;updateUI();return}current++;}}
  $('prev').onclick=prev;$('next').onclick=next;$('play').onclick=()=>playing?stop():playLoop();$('reset').onclick=()=>goto(0,true);
  addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();prev()}else if(e.key===' '){e.preventDefault();playing?stop():playLoop()}else if(e.key==='Home'){e.preventDefault();goto(0,true)}else if(e.key==='End'){e.preventDefault();goto(steps.length-1,true)}});
  buildTimeline();updateUI();clearHighlights();highlight(0);applyState(-1);setTimeout(()=>animateStep(0),430);
})();
</script>
