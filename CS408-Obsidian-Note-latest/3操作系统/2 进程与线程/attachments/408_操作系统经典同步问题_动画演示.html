<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>考研 408｜经典同步问题动画演示</title>
<style>
:root{
  --bg:#090b10;
  --panel:#11141b;
  --panel-2:#161a23;
  --glass:rgba(28,31,40,.60);
  --line:rgba(255,255,255,.095);
  --line-2:rgba(255,255,255,.16);
  --text:#f5f7fb;
  --muted:#9aa3b5;
  --muted-2:#697386;
  --accent:#78a7ff;
  --accent-soft:rgba(120,167,255,.15);
  --good:#67d49b;
  --good-soft:rgba(103,212,155,.14);
  --warn:#ffbe6d;
  --warn-soft:rgba(255,190,109,.14);
  --bad:#ff7c8d;
  --bad-soft:rgba(255,124,141,.14);
  --purple:#a990ff;
  --purple-soft:rgba(169,144,255,.14);
  --cyan:#69d3e8;
  --cyan-soft:rgba(105,211,232,.13);
  --radius-xl:28px;
  --radius-lg:20px;
  --radius-md:14px;
  --pill:999px;
  --ease:cubic-bezier(.22,.8,.22,1);
  --shadow:0 28px 80px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:
    radial-gradient(52rem 28rem at 8% -8%,rgba(89,115,255,.15),transparent 64%),
    radial-gradient(42rem 24rem at 94% 0%,rgba(92,211,183,.085),transparent 66%),
    linear-gradient(180deg,#0b0d13,#090b10 72%);
  letter-spacing:-.012em;
}
button,input{font:inherit}
button{color:inherit}
.app{
  width:min(1220px,calc(100% - 32px));
  margin:0 auto;
  padding:28px 0 38px;
}
.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:18px;
  animation:enter .7s var(--ease) both;
}
.brand h1{
  margin:0;
  font-size:clamp(26px,3vw,38px);
  font-weight:740;
  letter-spacing:-.045em;
  line-height:1.03;
}
.brand p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:13px;
  font-weight:520;
}
.selectors{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.segmented{
  display:flex;
  gap:4px;
  padding:4px;
  border:1px solid var(--line);
  border-radius:var(--pill);
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(150%);
  backdrop-filter:blur(24px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.segmented button{
  min-height:38px;
  border:0;
  border-radius:var(--pill);
  padding:0 14px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:680;
  cursor:pointer;
  white-space:nowrap;
  transition:background .2s var(--ease),color .2s var(--ease),transform .15s ease;
}
.segmented button[aria-selected="true"]{
  color:var(--text);
  background:rgba(255,255,255,.105);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 5px 14px rgba(0,0,0,.14);
}
.segmented.mode button[data-mode="correct"][aria-selected="true"]{color:#c9f5df;background:var(--good-soft)}
.segmented.mode button[data-mode="error"][aria-selected="true"]{color:#ffd0d6;background:var(--bad-soft)}
.segmented button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{
  outline:2px solid rgba(126,173,255,.82);
  outline-offset:2px;
}

.workspace{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--radius-xl);
  background:
    radial-gradient(46rem 22rem at 50% -18%,rgba(105,130,255,.10),transparent 67%),
    linear-gradient(180deg,rgba(20,23,31,.97),rgba(13,16,23,.99));
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.04);
  animation:enter .76s .06s var(--ease) both;
}
.workspace::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.022) 47%,transparent 68%);
  transform:translateX(-48%);
  animation:sheen 1.05s .25s var(--ease) both;
}
.main-grid{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);
  min-height:610px;
}
.visual-panel{
  min-width:0;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
}
.scene-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  padding:18px 20px 6px;
}
.scene-title{
  min-width:0;
}
.scene-title .eyebrow{
  color:var(--muted-2);
  font-size:10px;
  font-weight:760;
  letter-spacing:.085em;
  text-transform:uppercase;
}
.scene-title h2{
  margin:4px 0 0;
  font-size:18px;
  font-weight:700;
  letter-spacing:-.025em;
}
.status-pill{
  flex:0 0 auto;
  min-height:30px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:var(--pill);
  color:var(--muted);
  background:rgba(255,255,255,.035);
  font-size:11px;
  font-weight:680;
}
.status-pill::before{
  content:"";
  width:7px;height:7px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px rgba(120,167,255,.09);
}
.status-pill.good::before{background:var(--good);box-shadow:0 0 0 4px rgba(103,212,155,.09)}
.status-pill.bad::before{background:var(--bad);box-shadow:0 0 0 4px rgba(255,124,141,.10)}

.scene-wrap{
  position:relative;
  flex:1;
  min-height:390px;
  overflow:hidden;
}
.scene{
  width:100%;
  height:100%;
  min-height:390px;
  display:block;
}
.scene .soft-line{stroke:rgba(255,255,255,.065);stroke-width:1}
.scene .resource{
  fill:rgba(255,255,255,.035);
  stroke:rgba(255,255,255,.10);
  stroke-width:1.2;
}
.scene .resource.good{fill:var(--good-soft);stroke:rgba(103,212,155,.38)}
.scene .resource.warn{fill:var(--warn-soft);stroke:rgba(255,190,109,.42)}
.scene .resource.bad{fill:var(--bad-soft);stroke:rgba(255,124,141,.46)}
.scene .agent-shell{
  fill:rgba(255,255,255,.045);
  stroke:rgba(255,255,255,.105);
  stroke-width:1;
}
.scene .agent-shell.active{fill:var(--accent-soft);stroke:rgba(120,167,255,.45)}
.scene .agent-shell.wait{fill:var(--warn-soft);stroke:rgba(255,190,109,.42)}
.scene .agent-shell.bad{fill:var(--bad-soft);stroke:rgba(255,124,141,.5)}
.scene .agent-shell.good{fill:var(--good-soft);stroke:rgba(103,212,155,.44)}
.scene .label{
  fill:#e9edf5;
  font-size:13px;
  font-weight:700;
  text-anchor:middle;
}
.scene .sub{
  fill:#7f899a;
  font-size:10px;
  font-weight:620;
  text-anchor:middle;
}
.scene .tiny{
  fill:#697386;
  font-size:9px;
  font-weight:650;
  text-anchor:middle;
}
.scene .counter{
  fill:#f5f7fb;
  font-size:22px;
  font-weight:760;
  text-anchor:middle;
  font-variant-numeric:tabular-nums;
}
.scene .token{
  fill:#7fa8ff;
  stroke:rgba(255,255,255,.14);
  stroke-width:1;
}
.scene .token.good{fill:#68cb98}
.scene .token.warn{fill:#ffb866}
.scene .token.bad{fill:#ff7e8e}
.scene .token.purple{fill:#9f8af2}
.scene .fork{
  stroke:#778299;
  stroke-width:6;
  stroke-linecap:round;
  transition:stroke .25s ease,filter .25s ease;
}
.scene .fork.held{stroke:#d7e4ff;filter:drop-shadow(0 0 7px rgba(120,167,255,.18))}
.scene .fork.blocked{stroke:#ff8d9c;filter:drop-shadow(0 0 7px rgba(255,124,141,.18))}
.scene .arrow{
  stroke:rgba(120,167,255,.62);
  stroke-width:2;
  fill:none;
  stroke-linecap:round;
  stroke-dasharray:5 6;
}
.scene .warning-ring{
  fill:none;
  stroke:rgba(255,124,141,.72);
  stroke-width:2;
  stroke-dasharray:6 6;
}
.scene .ok-ring{
  fill:none;
  stroke:rgba(103,212,155,.58);
  stroke-width:2;
  stroke-dasharray:6 6;
}
.scene .moving{
  transform-box:fill-box;
  transform-origin:center;
  transition:transform .52s var(--ease),opacity .25s ease;
}
.scene .pulse{animation:pulse 1.1s ease-in-out infinite}

.step-readout{
  min-height:90px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  padding:6px 20px 14px;
}
.step-copy{min-width:0}
.step-copy .eyebrow{
  color:var(--muted-2);
  font-size:10px;
  font-weight:760;
  letter-spacing:.08em;
}
.step-copy h3{
  margin:4px 0 0;
  font-size:17px;
  font-weight:700;
  letter-spacing:-.022em;
}
.step-copy p{
  margin:5px 0 0;
  max-width:690px;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}
.state-badges{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.state-badge{
  min-height:30px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:0 9px;
  border:1px solid var(--line);
  border-radius:10px;
  background:rgba(255,255,255,.035);
  color:var(--muted);
  font-size:10px;
  font-weight:650;
  font-variant-numeric:tabular-nums;
}
.state-badge strong{color:#e8edf6;font-size:11px}

.code-panel{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:rgba(8,10,15,.28);
}
.code-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:18px 18px 11px;
  border-bottom:1px solid var(--line);
}
.code-head h2{
  margin:0;
  font-size:13px;
  font-weight:720;
  letter-spacing:-.01em;
}
.code-head span{
  color:var(--muted-2);
  font-size:10px;
}
.code-scroll{
  flex:1;
  min-height:0;
  padding:12px 10px 14px;
  overflow:auto;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.14) transparent;
}
.code-block{
  margin:0;
  padding:0;
  font:12.5px/1.72 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  letter-spacing:0;
  counter-reset:code-line;
}
.code-line{
  position:relative;
  display:grid;
  grid-template-columns:30px minmax(0,1fr);
  gap:10px;
  min-height:25px;
  padding:2px 10px 2px 3px;
  border-radius:8px;
  color:#939daf;
  white-space:pre-wrap;
  transition:color .18s ease,background .18s ease,opacity .18s ease;
}
.code-line .no{
  color:#4f5869;
  text-align:right;
  user-select:none;
  font-variant-numeric:tabular-nums;
}
.code-line .txt{min-width:0}
.code-line.section{
  margin-top:8px;
  color:#c0cad9;
  font-weight:720;
}
.code-line.section .no{color:transparent}
.code-line.comment{color:#657083}
.code-line.active{
  color:#f4f7fc;
  background:rgba(120,167,255,.105);
  box-shadow:inset 2px 0 0 var(--accent);
}
.code-line.active .no{color:#9bc0ff}
.code-line.near{color:#b2bccb}
.code-line.danger.active{
  background:rgba(255,124,141,.105);
  box-shadow:inset 2px 0 0 var(--bad);
}
.code-line.danger.active .no{color:#ffa4b0}
.code-note{
  padding:11px 14px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}
.code-note strong{color:#e7ecf5;font-weight:700}

.progress{
  position:relative;
  z-index:2;
  height:2px;
  margin:0 20px;
  overflow:hidden;
  border-radius:999px;
  background:rgba(255,255,255,.055);
}
.progress>div{
  height:100%;
  width:0;
  border-radius:inherit;
  background:linear-gradient(90deg,#78a7ff,#9d8eff);
  transition:width .34s var(--ease);
}
.control-wrap{position:relative;z-index:3;padding:12px 14px 14px}
.control-bar{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
  min-height:70px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:22px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(28px) saturate(155%);
  backdrop-filter:blur(28px) saturate(155%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 34px rgba(0,0,0,.18);
}
.control-left,.control-center,.control-right{display:flex;align-items:center;gap:8px}
.control-center{justify-content:center}
.control-right{justify-content:flex-end}
.icon-btn,.play-btn{
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  cursor:pointer;
  transition:transform .17s ease,background .17s ease,border-color .17s ease,opacity .17s ease;
}
.icon-btn{
  width:44px;height:44px;padding:0;border-radius:50%;
  background:rgba(255,255,255,.055);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.icon-btn:hover{background:rgba(255,255,255,.085);border-color:var(--line-2)}
.icon-btn:active,.play-btn:active{transform:scale(.95)}
.play-btn{
  width:50px;height:50px;padding:0;border-radius:50%;
  color:#07101d;background:#edf3ff;border-color:rgba(255,255,255,.22);
  box-shadow:0 7px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.7);
}
.icon-btn svg,.play-btn svg{width:18px;height:18px;display:block}
button:disabled{opacity:.32;cursor:default;transform:none!important}
.step-count{
  min-width:70px;
  color:var(--muted);
  font-size:11px;
  font-variant-numeric:tabular-nums;
}
.speed{
  display:flex;align-items:center;gap:8px;
  color:var(--muted);font-size:11px;
}
.speed input{width:90px;accent-color:#dce8ff}
.shortcuts{display:flex;gap:4px}
kbd{
  min-width:24px;height:24px;padding:0 7px;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.105);
  border-radius:8px;
  color:#aeb7c7;background:rgba(255,255,255,.055);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  font:650 10px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
}
@keyframes enter{
  from{opacity:0;transform:translateY(12px) scale(.995)}
  to{opacity:1;transform:none}
}
@keyframes sheen{
  from{opacity:0;transform:translateX(-48%)}
  40%{opacity:1}
  to{opacity:0;transform:translateX(48%)}
}
@keyframes pulse{
  0%,100%{opacity:.65}
  50%{opacity:1}
}
@media(max-width:920px){
  .topbar{align-items:flex-start;flex-direction:column}
  .selectors{width:100%;justify-content:flex-start}
  .main-grid{grid-template-columns:1fr}
  .visual-panel{border-right:0;border-bottom:1px solid var(--line)}
  .code-panel{min-height:360px}
  .code-scroll{max-height:390px}
}
@media(max-width:620px){
  .app{width:min(100% - 18px,1220px);padding-top:16px}
  .brand p{display:none}
  .selectors{gap:6px}
  .segmented{width:100%}
  .segmented button{flex:1;padding:0 8px}
  .scene-head{padding:14px 14px 4px}
  .scene-wrap{min-height:350px}
  .scene{min-height:350px}
  .step-readout{align-items:flex-start;flex-direction:column;padding:6px 14px 12px}
  .state-badges{justify-content:flex-start}
  .control-wrap{padding:10px 8px 8px}
  .control-bar{padding:8px;gap:6px;border-radius:18px}
  .control-left .shortcuts{display:none}
  .control-right .speed span{display:none}
  .control-right .speed input{width:66px}
  .step-count{min-width:54px;font-size:10px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <h1>经典同步问题</h1>
      <p>正确同步 · 错误同步 · 伪代码逐行联动</p>
    </div>

    <div class="selectors">
      <div class="segmented" role="tablist" aria-label="选择同步问题">
        <button type="button" role="tab" data-problem="rw" aria-selected="true">读者写者</button>
        <button type="button" role="tab" data-problem="pc" aria-selected="false">生产者消费者</button>
        <button type="button" role="tab" data-problem="dp" aria-selected="false">哲学家</button>
      </div>
      <div class="segmented mode" role="tablist" aria-label="选择正确或错误演示">
        <button type="button" role="tab" data-mode="correct" aria-selected="true">正确</button>
        <button type="button" role="tab" data-mode="error" aria-selected="false">错误</button>
      </div>
    </div>
  </header>

  <section class="workspace">
    <div class="main-grid">
      <section class="visual-panel">
        <div class="scene-head">
          <div class="scene-title">
            <div class="eyebrow" id="sceneEyebrow">READERS · WRITERS</div>
            <h2 id="sceneTitle">读者优先同步</h2>
          </div>
          <div class="status-pill good" id="statusPill">安全</div>
        </div>

        <div class="scene-wrap">
          <svg id="scene" class="scene" viewBox="0 0 760 410" role="img" aria-label="操作系统同步问题动画">
            <defs>
              <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                <path d="M0,0 L0,6 L7,3 z" fill="rgba(120,167,255,.72)"></path>
              </marker>
            </defs>
            <g id="sceneLayer"></g>
          </svg>
        </div>

        <div class="step-readout">
          <div class="step-copy">
            <div class="eyebrow" id="stepEyebrow">STEP 1</div>
            <h3 id="stepTitle">准备</h3>
            <p id="stepMessage" aria-live="polite"></p>
          </div>
          <div class="state-badges" id="stateBadges"></div>
        </div>
      </section>

      <aside class="code-panel" aria-label="同步伪代码">
        <div class="code-head">
          <h2>伪代码</h2>
          <span id="codeHint">当前执行行高亮</span>
        </div>
        <div class="code-scroll" id="codeScroll">
          <pre class="code-block" id="codeBlock"></pre>
        </div>
        <div class="code-note" id="codeNote"></div>
      </aside>
    </div>

    <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>

    <div class="control-wrap">
      <div class="control-bar">
        <div class="control-left">
          <button type="button" class="icon-btn" id="resetBtn" aria-label="重置" aria-keyshortcuts="R" title="重置（R）">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4.8 8.1A8 8 0 1 1 4 14m.8-5.9V4.4m0 3.7h3.7"/></svg>
          </button>
          <div class="shortcuts" aria-label="键盘快捷键">
            <kbd>←</kbd><kbd>→</kbd><kbd>Space</kbd>
          </div>
        </div>

        <div class="control-center">
          <button type="button" class="icon-btn" id="prevBtn" aria-label="上一步" aria-keyshortcuts="ArrowLeft" title="上一步（←）">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M14.8 6.5 9.3 12l5.5 5.5"/></svg>
          </button>
          <button type="button" class="play-btn" id="playBtn" aria-label="播放" aria-keyshortcuts="Space" title="播放 / 暂停（Space）">
            <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.4 6.7c0-1 1.1-1.6 1.9-1l7.9 5.1c.8.5.8 1.7 0 2.2l-7.9 5.2c-.8.5-1.9-.1-1.9-1V6.7Z" fill="currentColor"/></svg>
          </button>
          <button type="button" class="icon-btn" id="nextBtn" aria-label="下一步" aria-keyshortcuts="ArrowRight" title="下一步（→）">

      const a=(-90+i*72)*Math.PI/180;
      positions.push({x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R,a});
    }

    // forks lie between philosophers
    for(let i=0;i<5;i++){
      const a=(-54+i*72)*Math.PI/180;

      const x2=cx+Math.cos(a)*102,y2=cy+Math.sin(a)*102;

      if(st.violation) cls+=" blocked";

      g.appendChild(text(cx+Math.cos(a)*114,cy+Math.sin(a)*114,`F${i}`,"tiny"));
    }

    positions.forEach((p,i)=>{
      let status=st.p?.[i]||"think";
      let cls="agent-shell";
      if(status==="eat"||status==="active") cls+=" active";
      if(status==="wait") cls+=" wait";
      if(status==="done") cls+=" good";
      const grp=group(`translate(${p.x} ${p.y})`);
      grp.classList.add("moving");
      grp.appendChild(svg("circle",{cx:0,cy:0,r:34,class:cls}));
      grp.appendChild(text(0,-3,`P${i}`,"label"));
      grp.appendChild(text(0,13,statusLabel(status),"tiny"));
      if(status==="eat") setTransform(grp,`translate(${(cx-p.x)*.09}px,${(cy-p.y)*.09}px) scale(1.04)`);
      g.appendChild(grp);
    });

    if(st.violation){
      g.appendChild(svg("circle",{cx,cy,r:158,class:"warning-ring pulse"}));
      const path=svg("path",{d:"M380 43 A165 165 0 1 1 379.9 43",class:"arrow","marker-end":"url(#arrowHead)"});
      g.appendChild(path);
      g.appendChild(text(cx,cy+5,"CIRCULAR WAIT","sub"));
    }else if(st.room!=null){
      g.appendChild(svg("circle",{cx,cy,r:158,class:"ok-ring"}));
    }
  }

  function currentSteps(){return steps[problem][mode]}
  function currentStep(){return currentSteps()[current]}

  function renderCode(){
    const spec=pseudocode[problem][mode];
    els.code.innerHTML="";
    spec.lines.forEach((line,i)=>{
      const div=document.createElement("span");
      div.className="code-line";
      if(line.k) div.classList.add(line.k);
      if(line.bad) div.classList.add("danger");
      if(i===currentStep().line) div.classList.add("active");
      else if(Math.abs(i-currentStep().line)<=1) div.classList.add("near");

      const no=document.createElement("span");
      no.className="no";
      no.textContent=line.k==="section"?"":String(i+1).padStart(2,"0");
      const tx=document.createElement("span");
      tx.className="txt";
      tx.textContent=line.t || " ";
      div.append(no,tx);
      els.code.appendChild(div);
    });
    els.codeNote.innerHTML=`<strong>${mode==="correct"?"正确要点":"错误原因"}：</strong>${spec.note}`;

    requestAnimationFrame(()=>{
      const active=els.code.querySelector(".active");
      if(active) active.scrollIntoView({block:"nearest",behavior:reducedMotion?"auto":"smooth"});
    });
  }

  function renderBadges(st){
    els.badges.innerHTML="";
    let data=[];
    if(problem==="rw"){
      data=[
        ["read_count",st.rc??0],
        ["rw",st.rw||"free"],
        ["mutex",st.mutex||"free"]
      ];
    }else if(problem==="pc"){
      data=[
        ["empty",st.empty],
        ["full",st.full],
        ["mutex",st.mutex||"free"]
      ];
    }else{
      data=[
        ["room",st.room==null?"—":st.room],
        ["held forks",(st.forks||[]).filter(v=>v!=null).length]
      ];
    }
    data.forEach(([k,v])=>{
      const d=document.createElement("span");
      d.className="state-badge";
      d.innerHTML=`${k} <strong>${v}</strong>`;
      els.badges.appendChild(d);
    });
  }

  function render(){
    const step=currentStep();
    const st=step.s;

    els.sceneEyebrow.textContent=meta[problem].eyebrow;
    els.sceneTitle.textContent=meta[problem][mode];
    els.stepEyebrow.textContent=`STEP ${current+1}`;
    els.stepTitle.textContent=step.title;
    els.stepMessage.textContent=step.msg;
    els.count.textContent=`${current+1} / ${currentSteps().length}`;
    els.progress.style.width=`${((current+1)/currentSteps().length)*100}%`;

    const isBad=!!st.violation;
    els.status.className=`status-pill ${isBad?"bad":mode==="correct"?"good":""}`;
    els.status.textContent=isBad ? (problem==="rw"?"冲突":problem==="pc"?"死锁":"死锁") : (mode==="correct"?"安全":"错误路径");

    if(problem==="rw") renderRW(st);
    else if(problem==="pc") renderPC(st);
    else renderDP(st);

    renderBadges(st);
    renderCode();
    updateControls();
  }

  function updateControls(){
    els.prev.disabled=current===0;
    els.reset.disabled=current===0 && !playing;
    els.next.disabled=current===currentSteps().length-1;
    els.play.setAttribute("aria-label",playing?"暂停":"播放");
    els.play.title=playing?"暂停（Space）":"播放（Space）";
    els.playIcon.innerHTML=playing
      ? '<path d="M7.7 6.5h3v11h-3zm5.6 0h3v11h-3z" fill="currentColor"/>'
      : '<path d="M8.4 6.7c0-1 1.1-1.6 1.9-1l7.9 5.1c.8.5.8 1.7 0 2.2l-7.9 5.2c-.8.5-1.9-.1-1.9-1V6.7Z" fill="currentColor"/>';
  }

  function pause(){
    playing=false;
    clearTimeout(timer);
    timer=null;
    updateControls();
  }

  function schedule(){
    clearTimeout(timer);
    if(!playing) return;
    timer=setTimeout(()=>{
      if(current>=currentSteps().length-1){
        pause();
        return;
      }
      current++;
      render();
      schedule();
    },speedMs[els.speed.value]);
  }

  function togglePlay(){
    if(playing){pause();return}
    if(current>=currentSteps().length-1) current=0;
    playing=true;
    render();
    schedule();
  }

  function go(delta){
    pause();
    current=Math.max(0,Math.min(currentSteps().length-1,current+delta));
    render();
  }

  function reset(){
    pause();
    current=0;
    render();
  }

  function setProblem(next){
    if(next===problem) return;
    pause();
    problem=next;
    current=0;
    document.querySelectorAll("[data-problem]").forEach(btn=>{
      btn.setAttribute("aria-selected",String(btn.dataset.problem===problem));
    });
    render();
  }

  function setMode(next){
    if(next===mode) return;
    pause();
    mode=next;
    current=0;
    document.querySelectorAll("[data-mode]").forEach(btn=>{
      btn.setAttribute("aria-selected",String(btn.dataset.mode===mode));
    });
    render();
  }

  document.querySelectorAll("[data-problem]").forEach(btn=>{
    btn.addEventListener("click",()=>setProblem(btn.dataset.problem));
  });
  document.querySelectorAll("[data-mode]").forEach(btn=>{
    btn.addEventListener("click",()=>setMode(btn.dataset.mode));
  });

  els.prev.addEventListener("click",()=>go(-1));
  els.next.addEventListener("click",()=>go(1));
  els.reset.addEventListener("click",reset);
  els.play.addEventListener("click",togglePlay);
  els.speed.addEventListener("input",()=>{if(playing)schedule()});

  document.addEventListener("keydown",e=>{
    if(e.defaultPrevented||e.metaKey||e.ctrlKey||e.altKey) return;
    const tag=e.target?.tagName?.toLowerCase();
    if(tag==="input"||tag==="textarea"||tag==="select"||e.target?.isContentEditable) return;
    if(e.code==="Space"){e.preventDefault();togglePlay()}
    else if(e.code==="ArrowLeft"){e.preventDefault();go(-1)}
    else if(e.code==="ArrowRight"){e.preventDefault();go(1)}
    else if(e.code==="KeyR"){e.preventDefault();reset()}
  });

  render();
})();
</script>
